# Griffin hardware definition -- the source for (1) CPU interaction: memory
# map, register bitfields and their legal values, constants CPU code writes to
# and between components; (2) bitfile creation: the same bitfields and the
# structural rules the CPLDs implement; (3) high-level schematic validation:
# which chip drives which net.  Machine-readable fields feed codegen.py
# (C/C++, GAS, ld, Verilog headers); comments state only the contracts no
# implementation states.  Rationale, history and measurements: griffin.log.

project:
  name: Griffin
  cpu: MC68010    # 68000 is a drop-in
  clock_hz: 14000000
  interrupt_mode: autovector

peripherals:
  GLUE:
    part: ATF1508AS
    description: "System glue logic and PS/2 keyboard"
    address_range:
      base: 0xF00000
      size: 0x040000
      width: 8
    dtack:
      - 12000000: 0
      - 14000000: 0
      - 14318181: 0
      - 16000000: 0
      - 20000000: 0
    interrupt:
      level: 4
      signal: ~PS2_IRQ
    registers:
      - offset: 0x01
        name: DEBUG_OUT
        access: write
        width: 8
        description: "Set or clear DEBUG_OUT signal (debug LED and test point output)"
        bits:
          - { bit: "0", name: OUT, description: "DEBUG_OUT drive level" }
      - offset: 0x07
        name: CONFIG
        access: write
        width: 8
        description: "GLUE configuration register"
        bits:
          - { bit: "0", name: ROM_OVERLAY_DISABLE, default: 0,
              description: "Write 1 to disable ROM overlay and unmap ROM from RAM bank 1 address space" }
          - { bit: "1", name: FLASH_WE_EN, default: 0,
              description: "Write 1 to enable the ~ROM_WE strobe so ROM-window word writes reach the flash (JEDEC program/erase); 0 write-protects flash" }
          - { bit: "2", name: VSYNC_IRQ_EN, default: 0,
              description: "Write 1 to let a latched vsync drive the level-6 IPL code; 0 (reset value) suppresses only the IRQ term, leaving the vsync_pending latch, VSYNC_STATUS readback and VSYNC_CLEAR W1C live so firmware can poll vblank without an ISR" }
      - offset: 0x09
        name: PS2_TX_DATA
        access: write
        width: 8
        description: |
          Byte to transmit host->device; the write itself starts the frame.
          Precondition: CPU has held PS2_CLK low >= 100 us via PS2_CTRL.CLK.
          Frame is start/8-data-LSB-first/parity/stop shifted on device
          PS2_CLK falling edges; device ACK lands in TX_ACK and TX_DONE
          raises the level-4 IRQ.  Parity is not computed in hardware:
          address bit 1 carries it, so write PS2_TX_DATA for parity 0 or
          PS2_TX_DATA + PS2_TX_DATA_PARITY (0x0B) for parity 1.  Ignored
          while a TX or RX frame is in progress.
        bits:
          - { bit: "7:0", name: DATA, description: "Data byte to send (write triggers TX)" }
      - offset: 0x11
        name: PS2_STATUS
        access: read
        width: 8
        description: |
          PS/2 frame-engine status.
          One IRQ per assembled 11-bit RX frame (RX_READY) or completed TX
          (TX_DONE); both W1C via PS2_CLEAR.  Firmware checks odd parity
          from RX_PARITY.
        bits:
          - { bit: "0", name: RX_READY,
              description: "1 = a received byte is in PS2_RX_DATA; asserts level-4 IRQ; W1C via PS2_CLEAR" }
          - { bit: "1", name: TX_DONE,
              description: "1 = host->device frame finished; asserts level-4 IRQ; W1C via PS2_CLEAR" }
          - { bit: "2", name: TX_ACK,
              description: "Device ACK sampled on the final clock of the last TX (0 = acknowledged)" }
          - { bit: "3", name: RX_PARITY,
              description: "Received parity bit of the latched byte (firmware checks odd parity)" }
          - { bit: "4", name: RX_FRAME_ERR,
              description: "1 = received stop bit was not 1 (framing error)" }
          - { bit: "5", name: DATA_LIVE,
              description: "Unlatched synchronized PS2_DATA pin state (debug)" }
          - { bit: "6", name: CLK_LIVE,
              description: "Debounced PS2_CLK level the frame engine clocks on, not the raw pin (debug)" }
      - offset: 0x11
        name: PS2_CLEAR
        access: write
        width: 8
        description: |
          Write-1-to-clear for PS2_STATUS latched flags / IRQ ack.
          The level-4 IRQ de-asserts on the same cycle once both RX_READY
          and TX_DONE are clear.
        bits:
          - { bit: "0", name: RX_READY, description: "Write 1 to clear RX_READY (RX byte ISR ack)" }
          - { bit: "1", name: TX_DONE,  description: "Write 1 to clear TX_DONE (TX completion ISR ack)" }
      - offset: 0x13
        name: PS2_CTRL
        access: write
        width: 8
        description: |
          Open-drain drive control for PS2_CLK and PS2_DATA for the TX inhibit handshake.
          Set = drive low; clear = tri-state to the external pull-up.  CLK is
          ignored while a TX frame is in progress (the engine owns the pins).
        bits:
          - { bit: "0", name: CLK,
              description: "1 = drive PS2_CLK low (inhibit device / request-to-send); 0 = tri-state" }
          - { bit: "1", name: DATA,
              description: "1 = drive PS2_DATA low; 0 = tri-state (pull-up high)" }
      - offset: 0x15
        name: PS2_RX_DATA
        access: read
        width: 8
        description: "Assembled PS/2 data byte; valid while RX_READY is set."
        bits:
          - { bit: "7:0", name: DATA, description: "Received scancode byte (LSB-first on the wire)" }
      - offset: 0x17
        name: VSYNC_STATUS
        access: read
        width: 8
        description: |
          Latched vsync frame interrupt status.
          GLUE 2-FF synchronizes TIMING's nVSYNC_IRQ and latches its
          assertion edge; while CONFIG.VSYNC_IRQ_EN is set the latch asserts
          the level-6 IRQ until cleared via VSYNC_CLEAR.  Latch and readback
          are unconditional, so firmware may poll and acknowledge with no ISR.
        bits:
          - { bit: "0", name: VSYNC_PENDING,
              description: "1 = a vsync edge has been latched; asserts the level-6 IRQ when CONFIG bit VSYNC_IRQ_EN is set; W1C via VSYNC_CLEAR" }
      - offset: 0x17
        name: VSYNC_CLEAR
        access: write
        width: 8
        description: "Write-1-to-clear for VSYNC_PENDING / level-6 IRQ ack."
        bits:
          - { bit: "0", name: VSYNC_PENDING, description: "Write 1 to clear VSYNC_PENDING (vsync ISR ack)" }

  # Decode: A23 & ~A22; the 1MB image mirrors 4x through the 4MB window.
  # At reset ROM is also overlaid over RAM bank 1 until CONFIG.ROM_OVERLAY_DISABLE.
  # In-circuit reflash: GLUE asserts ~ROM_WE to both chips' WE# only for
  # (A23 & ~A22) & ~R/W & AS & UDS & LDS & CONFIG.FLASH_WE_EN -- word writes
  # only (keeps the x8 pair in lockstep), raw region only (overlay writes
  # never reach flash), locked at reset.  Both chips see the same command
  # byte in each lane; chip A0 is CPU A1, so JEDEC chip addresses
  # 0x5555/0x2AAA are CPU 0x80AAAA/0x805554.  Sector = 4KB/chip = 8KB CPU,
  # 8KB aligned.  Flasher must run from RAM (.ramtext) with the overlay off.
  ROM:
    part: "2x SST39SF040-70 (512Kx8 DIP-32 5V NOR flash, socketed; 1MB total)"
    address_range:
      base: 0x800000
      size: 0x100000
      window: 0x400000
      width: 16
    dtack:
      - 12000000: 1
      - 14000000: 1
      - 14318181: 1
      - 16000000: 1
      - 20000000: 1
    linker:
      section: rom

  # 4 banks x 1MB, each a pair of AS6C4008 (one per byte lane).  GLUE decodes
  # nRAM_[1-4]_SEL from A21:20 within A23:22 == 00, drives WRITE_LO/WRITE_HI
  # byte strobes, /OE from nR_W.  All four banks are always populated.
  RAM_BANK_1:
    part: "2x AS6C4008"
    address_range:
      base: 0x000000
      size: 0x100000
      width: 16
    dtack:
      - 12000000: 0
      - 14000000: 0
      - 14318181: 0
      - 16000000: 0
      - 20000000: 1
    linker:
      section: ram

  RAM_BANK_2:
    part: "2x AS6C4008"
    address_range:
      base: 0x100000
      size: 0x100000
      width: 16
    dtack:
      - 12000000: 0
      - 14000000: 0
      - 14318181: 0
      - 16000000: 0
      - 20000000: 1
    linker:
      section: ram

  RAM_BANK_3:
    part: "2x AS6C4008"
    address_range:
      base: 0x200000
      size: 0x100000
      width: 16
    dtack:
      - 12000000: 0
      - 14000000: 0
      - 14318181: 0
      - 16000000: 0
      - 20000000: 1
    linker:
      section: ram

  RAM_BANK_4:
    part: "2x AS6C4008"
    address_range:
      base: 0x300000
      size: 0x100000
      width: 16
    dtack:
      - 12000000: 0
      - 14000000: 0
      - 14318181: 0
      - 16000000: 0
      - 20000000: 1
    linker:
      section: ram

  # nENGINE_SELECT comes from GLUE
  # Write-only MMIO decoded on A[2:1] with LDS; reads see the open bus.
  # ENGINE is a bus master (BR/BG/BGACK): each 4-word descriptor reads
  # count words from any address and pulses one active-low deposit strobe
  # (ENGINE_SIGNAL_*) per word -- PIXELS / VIDCMD / AUDIO FIFO /W -- so the
  # consumers' data pins sit directly on D[15:0] and need no address decode.
  # Descriptors themselves are read only from the top 64K of RAM.
  # wait_hblank descriptors wait for the rising edge of TIMING's HBLANK.
  # Descriptor format and strobe semantics: super-engine/descriptor.h and
  # vidcmd-spec.md.
  ENGINE:
    part: ATF1508AS
    description: "Display-list DMA engine walking 4-word descriptors from the top 64K of RAM"
    address_range:
      base: 0xD00000
      size: 0x100000
      width: [8, 16]
    dtack:
      - 12000000: 0
      - 14000000: 0
      - 14318181: 0
      - 16000000: 0
      - 20000000: 0
    interrupt:
      level: 3
      signal: ~ENGINE_IRQ
    registers:
      - offset: 0x02
        name: DESC
        access: write
        width: 16
        description: |
          Descriptor word address within RAM's top 64K; writing arms DMA.
          D[14:0] is the word address of the first 4-word descriptor (byte
          address 0x3F0000 + 2*addr); descriptors are 4-word aligned.  The
          write also clears a pending ~ENGINE_IRQ.
        bits:
          - { bit: "14:0", name: ADDR,
              description: "Word address of the first descriptor within the top 64K of RAM" }
      - offset: 0x05
        name: CTRL
        access: write
        width: 8
        description: |
          DMA enable and abort; any write clears a pending ~ENGINE_IRQ.
          A stop_after descriptor clears ENABLE itself at list end, so the
          usual IRQ ack is CTRL=0 from the level-3 ISR.
        bits:
          - { bit: "0", name: ENABLE, default: 0,
              description: "1 = run the armed list; 0 = abort and release the bus" }

  # None of TIMING -> PIXEL -> COMPOSITOR -> DAC is on the CPU bus.
  # the CPU # reaches them only through ENGINE's PIXELS/VIDCMD FIFO streams.
  # frame IRQ is TIMING's nVSYNC_IRQ latched in GLUE (VSYNC_STATUS/VSYNC_CLEAR).

  # TIMING (cpld/pixel/timing.v, ATF1504AS PLCC44) owns the VGA raster timing
  # and derived signals. No inputs but PIXEL_CLK and nRESET.  Output
  # contracts, enforced by cpld/pixel/timing_tb.v (`make timing-sim`):
  # - nRS: 8 pixel clocks at the top of the vsync line (v_cnt==V_SYNC_START
  #   & h_cnt<8).  Consumers: COMPOSITOR machine reset (GCLR) and /RS of the
  #   four video-stream FIFO chips; the 7200 needs /W and /RE inactive from
  #   tRSS 15 ns before its rise to tRSR 10 ns after, so ENGINE video-write
  #   descriptors must finish before vsync (audio strobes exempt).
  # - H_ACTIVE: leads the visible window by COMPOSITOR_LEAD (2) pixel clocks.
  #   Consumer: COMPOSITOR slot gating.
  # - PIX_CONSUME / PIX_PRELOAD / PIX_LAST: registered strobes to PIXEL, one
  #   clock late (TIMING_SPLIT_LEAD).  PIX_CONSUME = the 640 consumption
  #   clocks of a visible line; PIX_LAST = its last 8 (h_cnt[9:3]==79), a
  #   width pixel_tb's end-of-line cases assume; PIX_PRELOAD = one clock at
  #   H_TOTAL - PIXEL_PRELOAD_LEAD before a visible line.
  # - Sync compares shift late by DAC_LEAD (4); timing.v localparams must
  #   equal the lead constants below.
  # - HBLANK (pin 19) -> ENGINE pin 2: registered h_cnt >= 640, high for
  #   640..799 on EVERY line, visible or blank, rising on the clock
  #   PIX_CONSUME falls.  ENGINE 2-FF synchronizes it and wait_hblank
  #   descriptors wait for the rising edge, the start of the 160-clock
  #   blank budgeted in descriptor.h HBLANK_SYSCLK.  Not the HSYNC net
  #   (rises 116 clocks later), not ~H_ACTIVE (never toggles in vblank).
  # - nVSYNC_IRQ (pin 31) -> GLUE pin 65: registered ~in_vsync, identical to
  #   VGA_VSYNC today (negative, 2 lines at v = 490..491); polarity fixed for
  #   every future raster mode, so the connector's VSYNC polarity can change
  #   without moving the IRQ edge.  GLUE edge-latches it (VSYNC_STATUS).
  # - PADDLE_TICK (pin 17) -> PORTS pin 44 and AUDIO_TICK (pin 18) -> PORTS
  #   pin 45: square waves toggling on the clock that starts every line
  #   (period 1600 clocks, free-running from reset, no frame-boundary
  #   exception).  PORTS 2-FF synchronizes each and counts FALLING edges
  #   only: 15.734 kHz events (PADDLE_TICKS_PER_SECOND,
  #   AUDIO_SAMPLES_PER_SECOND).  Two nets so the audio rate can change in
  #   TIMING alone: event rate = toggle rate / 2.
  # - VGA_HSYNC and VGA_VSYNC drive ONLY the 74AC541 buffers.
  # - DUART OP4..OP7 -> TIMING pins 20, 21, 24, 25: reserved static
  #   configuration inputs (future raster/audio-rate select), not fitted;
  #   TIMING must treat the OP reset state 1111 as today's behaviour.
  #   GCLK2 (pin 44) is left free for an optional second oscillator.
  TIMING:
    part: "ATF1504AS (PLCC44)"
    description: "Raster time base: VGA syncs, frame /RS, COMPOSITOR H_ACTIVE, PIXEL strobes, ENGINE HBLANK, GLUE vsync IRQ, PORTS paddle/audio ticks"
    clock: 25175000    # dedicated pixel oscillator, not SYSCLK; shared by PIXEL and COMPOSITOR
    # VESA 640x480@60: 800x525 scan, negative sync polarity on both.  Counts:
    # horizontal in pixel clocks, vertical in lines; active -> front porch ->
    # sync -> back porch, summing to the total (codegen checks the sums).
    # timing.v's H_*/V_* localparams must equal these values; the generated
    # TIMING_H_*/TIMING_V_* defines are the checkable form.
    video_timing:
      pixel_clock_hz: 25175000
      h_active:       640
      h_front_porch:  16
      h_sync:         96
      h_back_porch:   48
      h_total:        800
      v_active:       480
      v_front_porch:  10
      v_sync:         2
      v_back_porch:   33
      v_total:        525
      hsync_polarity: negative   # asserted low during the sync interval
      vsync_polarity: negative

  # PIXEL (cpld/pixel/pixel.v) unpacks the PIXELS FIFO byte stream into R4G4B4
  # for COMPOSITOR and hosts the SET-target registers COMPOSITOR forwards.
  # - PIXELS FIFO read port: 2x IDT7200 as a byte-interleaved shared-Q pair,
  #   PIXELS_Q[7:0] in, nPIXELS_RE_EVEN / nPIXELS_RE_ODD out.  A byte is
  #   consumed every >= 8 pixel clocks (2bpp modes) or 16 (1bpp), so the port
  #   needs no read-timing analysis beyond COMPOSITOR's VIDCMD one at 8x the
  #   period.  /RS of the pair is TIMING's nRS.
  # - Raster events come only from TIMING (PIX_CONSUME / PIX_PRELOAD /
  #   PIX_LAST, see TIMING).  nRESET is the power-on GCLR, not the frame /RS.
  # - SET registers, applied directly at COMPOSITOR's set_pix_commit from the
  #   12-bit set_pix_value bus (targets VIDCMD_SET_PIX_*): PAL_FG, PAL_BG,
  #   HAM_HELD, MODE, PIXEL_SKIP.  MODE is decoded bitwise, not as an
  #   enumeration: mode[0] = 2bpp micro-HAM, mode[1] = 2bpp indexed,
  #   mode[2] = half rate (ignored in micro-HAM).  1bpp (mode[1:0] == 00) is
  #   80 bytes/line MSB first (PIXELS_WORDS_PER_LINE_1BPP); micro-HAM and
  #   indexed are two stream bits per pixel clock, 160 bytes/line
  #   (PIXELS_WORDS_PER_LINE_HAM); half rate holds each bit-group for two
  #   clocks and halves the stream (40 / 80 bytes) at half the horizontal
  #   resolution.  PIXEL_SKIP >= 8 discards whole bytes; [2:0] shifts bits.
  # - RGB_OUT[11:0] -> COMPOSITOR RGB_IN, one register after the decoder's
  #   held colour (PIXEL_OUT_LEAD).
  # - No empty-flag input and no half-full pacing: underrun repeats the last
  #   word (ENGINE must keep the stream ahead; see vidcmd-spec.md).
  # - `make pixel-sim` (pixel_tb.v) is the executable per-mode semantics.
  PIXEL:
    part: "ATF1508AS (PLCC84)"
    description: "PIXELS stream unpacker: 1bpp direct, 2bpp micro-HAM, 2bpp indexed, half rate; R4G4B4 to COMPOSITOR"
    clock: 25175000

  # COMPOSITOR (cpld/compositor/compositor.v) sits between PIXEL and the DAC.
  # It plays the per-line VIDCMD instruction stream out of the VIDCMD FIFO
  # (2x IDT7200 ganged 16-bit, filled by ENGINE) and for every active pixel
  # slot selects one of passthrough (RGB_IN from PIXEL), cmp_color1,
  # cmp_color0, or a RUN_COLOR's saturated colour.  Records: RUN, RUN_COLOR,
  # SET (targets VIDCMD_SET_*: 0..1 local, 2..6 forwarded to PIXEL), MASK
  # (two-word 16-pixel overlay).  Bit-level encodings are in
  # super-engine/descriptor.h and semantics in vidcmd-spec.md.  Everything is
  # in the PIXEL_CLK domain except nVIDCMD_EF (2-FF synchronized); H_ACTIVE,
  # nRS and RGB_IN arrive on the same clock unsynchronized.  Machine reset is
  # TIMING's nRS (GCLR), once per frame.  RGB_OUT[11:0] -> the 74AC541
  # buffers and DAC (see interfaces).
  # - VIDCMD FIFO read port (2x IDT7200L15, shared /RE): registered /RE
  #   from COMPOSITOR, 2 pixel clocks per word, no shaping gate; all edges
  #   are GCLK rising edges, so there is no duty-cycle dependence.  Pinned
  #   parameters: IDT7200L15 tRC 25 min / tA 15 max / tRPW 15 min / tRR 10
  #   min / tDV 5 min / tRHZ 15 max / tREF 15 max (REN_7200-7202_DST
  #   20171127, 30 pF); ATF1508AS-10 GCLK tSU 7 / tH 0, clock-pin-to-output
  #   8.0 ns max at 35 pF (DS20006682A Table 1-4); T = 39.72 ns.  Worst-case
  #   margins incl. ~2 ns flight and series termination: pulse +24.7 ns,
  #   recovery +29.7, cycle +54.4, data setup +7.7, hold +6.  Consequence:
  #   VIDCMD cadence is uniformly 2 slots per word (1-px spans render 2 px
  #   wide); compositor_tb, vidcmd-spec.md and the super-engine model encode
  #   it.
  # - VIDCMD FIFO /EF -> COMPOSITOR input, synchronized on-chip with an
  #   asymmetric guard (2-FF sync governs the asynchronous rise from
  #   ENGINE-domain writes; the raw flag governs the fall caused by
  #   COMPOSITOR's own clock-aligned read).  Requirement: tCO 8.0 + tREF 15
  #   + ~2 ns flight = 25.0 ns vs T - tSU = 32.7 ns (+7.7 ns worst case).
  # - COMPOSITOR -> PIXEL SET path: a dedicated 12-bit registered value bus
  #   set_pix_value[11:0] alongside the valid/target/commit handshake; the
  #   bus is registered from COMPOSITOR's staged word and PIXEL applies it
  #   at the commit pulse with no capture register.  Twelve point-to-point
  #   traces, same clock, full-cycle setup: ordinary synchronous routing.
  COMPOSITOR:
    part: "ATF1508AS (PLCC84)"
    description: "VIDCMD stream player: per-slot source select over PIXEL's R4G4B4, SET forwarding to PIXEL, MASK overlays"
    clock: 25175000

  # GLUE decodes the region, hands over ~PORTS_SELECT and answers DTACK.
  # Time bases come from TIMING: PADDLE_TICK (TIMING 17 -> PORTS 44) and
  # AUDIO_TICK (TIMING 18 -> PORTS 45), square waves toggling once per line;
  # PORTS 2-FF synchronizes each and counts FALLING edges only
  # (PADDLE_TICKS_PER_SECOND / AUDIO_SAMPLES_PER_SECOND).  PORTS has no
  # divider; a rate change is a TIMING change.
  # The mouse channel mirrors GLUE's keyboard register layout and offsets
  # (TX_DATA 0x09, STATUS/CLEAR 0x11, CTRL 0x13, RX_DATA 0x15).
  PORTS:
    part: ATF1508AS
    description: "PS/2 mouse, two joystick ports, two paddle counters, and the audio FIFO pop/reset control"
    address_range:
      base: 0xFC0000
      size: 0x040000
      width: 8
    dtack:
      - 12000000: 0
      - 14000000: 0
      - 14318181: 0
      - 16000000: 0
      - 20000000: 0
    interrupt:
      level: 2
      signal: ~PORTS_IRQ    # mouse RX_READY/TX_DONE only; audio raises no interrupt
    registers:
      - offset: 0x01
        name: JOYSTICK_PORT_1
        access: read
        width: 8
        description: |
          Joystick port 1 switches, active low (0 = closed).
          This port also hosts the paddles: PIN9/PIN5 double as SMS button 2
          and the raw pot comparator levels; paddle fire buttons appear on
          LEFT/RIGHT (2600 convention).  No interrupt; poll from the vsync
          ISR.  Bit 7 reads 1.
        bits:
          - { bit: "0", name: UP,    description: "Port 1 up, DE-9 pin 1 (0 = pressed)" }
          - { bit: "1", name: DOWN,  description: "Port 1 down, DE-9 pin 2" }
          - { bit: "2", name: LEFT,  description: "Port 1 left, DE-9 pin 3 (also paddle B fire)" }
          - { bit: "3", name: RIGHT, description: "Port 1 right, DE-9 pin 4 (also paddle A fire)" }
          - { bit: "4", name: FIRE,  description: "Port 1 fire, DE-9 pin 6" }
          - { bit: "5", name: PIN9,  description: "Port 1 DE-9 pin 9: SMS button 2 / paddle A pot level" }
          - { bit: "6", name: PIN5,  description: "Port 1 DE-9 pin 5: paddle B pot level" }
      - offset: 0x03
        name: JOYSTICK_PORT_2
        access: read
        width: 8
        description: |
          Joystick port 2 switches, active low (0 = closed).
          Same bit order as JOYSTICK_PORT_1; no paddles.  Bit 7 reads 1.
        bits:
          - { bit: "0", name: UP,    description: "Port 2 up, DE-9 pin 1 (0 = pressed)" }
          - { bit: "1", name: DOWN,  description: "Port 2 down, DE-9 pin 2" }
          - { bit: "2", name: LEFT,  description: "Port 2 left, DE-9 pin 3" }
          - { bit: "3", name: RIGHT, description: "Port 2 right, DE-9 pin 4" }
          - { bit: "4", name: FIRE,  description: "Port 2 fire, DE-9 pin 6" }
          - { bit: "5", name: PIN9,  description: "Port 2 DE-9 pin 9: SMS button 2" }
          - { bit: "6", name: PIN5,  description: "Port 2 DE-9 pin 5 (spare input)" }
      - offset: 0x05
        name: PADDLE_A_COUNT
        access: read
        width: 8
        description: |
          Paddle A position, the pot on port 1 pin 9.
          Counts PADDLE_TICK events while the pot's RC ramp holds the
          comparator low, freezes when it crosses, saturates at 0xFF (255
          ticks ~= 16.2 ms, one frame).  Board RC must cross full travel in
          < ~250 ticks.  Needs per-unit software calibration (comparator
          threshold; pot parallels the 1M pin-5/9 pull-up).
        bits:
          - { bit: "7:0", name: COUNT, description: "PADDLE_TICK count (15.734 kHz), saturating at 0xFF" }
      - offset: 0x07
        name: PADDLE_B_COUNT
        access: read
        width: 8
        description: |
          Paddle B position, the pot on port 1 pin 5.
          Behaves as PADDLE_A_COUNT; cleared by the same PADDLE_CONTROL.DUMP.
        bits:
          - { bit: "7:0", name: COUNT, description: "Line-rate count, saturating at 0xFF" }
      - offset: 0x09
        name: PS2_MOUSE_TX_DATA
        access: write
        width: 8
        description: |
          Byte to transmit host->mouse; the write itself starts the frame.
          Same protocol as GLUE PS2_TX_DATA, including parity in address
          bit 1 (write +PS2_TX_DATA_PARITY for parity 1) and TX_DONE on the
          level-2 IRQ.  Ignored while a TX or RX frame is in progress.
        bits:
          - { bit: "7:0", name: DATA, description: "Data byte to send (write triggers TX)" }
      - offset: 0x0F
        name: PADDLE_CONTROL
        access: write
        width: 8
        description: |
          Paddle measurement control, written once per vsync ISR.
          DUMP set drives the discharge-FET line and holds both counters at
          zero; clearing it releases the caps and starts the next measurement.
        bits:
          - { bit: "0", name: DUMP, default: 0,
              description: "1 = drain the paddle caps and hold both counters at zero; 0 = measure" }
      - offset: 0x11
        name: PS2_MOUSE_STATUS
        access: read
        width: 8
        description: |
          PS/2 mouse frame-engine status.
          Same semantics and bit layout as GLUE PS2_STATUS; W1C via
          PS2_MOUSE_CLEAR.
        bits:
          - { bit: "0", name: RX_READY,
              description: "1 = a received byte is in PS2_MOUSE_RX_DATA; asserts level-2 IRQ; W1C via PS2_MOUSE_CLEAR" }
          - { bit: "1", name: TX_DONE,
              description: "1 = host->device frame finished; asserts level-2 IRQ; W1C via PS2_MOUSE_CLEAR" }
          - { bit: "2", name: TX_ACK,
              description: "Device ACK sampled on the final clock of the last TX (0 = acknowledged)" }
          - { bit: "3", name: RX_PARITY,
              description: "Received parity bit of the latched byte (firmware checks odd parity)" }
          - { bit: "4", name: RX_FRAME_ERR,
              description: "1 = received stop bit was not 1 (framing error)" }
          - { bit: "5", name: DATA_LIVE,
              description: "Unlatched synchronized PS2_MOUSE_DATA pin state (debug)" }
          - { bit: "6", name: CLK_LIVE,
              description: "Debounced PS2_MOUSE_CLK level the frame engine clocks on, not the raw pin (debug)" }
      - offset: 0x11
        name: PS2_MOUSE_CLEAR
        access: write
        width: 8
        description: |
          Write-1-to-clear for PS2_MOUSE_STATUS latched flags / IRQ ack.
          The level-2 IRQ de-asserts once RX_READY and TX_DONE are clear.
        bits:
          - { bit: "0", name: RX_READY, description: "Write 1 to clear RX_READY (RX byte ISR ack)" }
          - { bit: "1", name: TX_DONE,  description: "Write 1 to clear TX_DONE (TX completion ISR ack)" }
      - offset: 0x13
        name: PS2_MOUSE_CTRL
        access: write
        width: 8
        description: |
          Open-drain drive control for PS2_MOUSE_CLK and PS2_MOUSE_DATA for the TX inhibit handshake.
          Same semantics as GLUE PS2_CTRL.
        bits:
          - { bit: "0", name: CLK,
              description: "1 = drive PS2_MOUSE_CLK low (inhibit device / request-to-send); 0 = tri-state" }
          - { bit: "1", name: DATA,
              description: "1 = drive PS2_MOUSE_DATA low; 0 = tri-state (pull-up high)" }
      - offset: 0x15
        name: PS2_MOUSE_RX_DATA
        access: read
        width: 8
        description: "Assembled PS/2 mouse data byte; valid while RX_READY is set."
        bits:
          - { bit: "7:0", name: DATA, description: "Received packet byte (LSB-first on the wire)" }
      - offset: 0x1F
        name: AUDIO_CONTROL
        access: write
        width: 8
        description: |
          Audio FIFO pop and reset control.
          ENABLE gates the read strobe PORTS sends to both 7200s on every
          AUDIO_TICK event; clearing it freezes the DACs on their last sample
          without disturbing FIFO contents.  RESET drives both 7200 /RS pins
          low, discarding every queued pair; its reset value 1 holds the FIFOs
          in reset from power-on (the 7200 requires a reset before its first
          write) until software releases it.  The 7200 needs /W and /RE
          inactive from tRSS 15 ns before /RS rises to tRSR 10 ns after:
          PORTS holds its own /RE off while RESET is set, and software must
          change RESET only when no descriptor list that deposits AUDIO_FIFO_W
          is armed.  Flush sequence: ENABLE=0, RESET=1, RESET=0, deposit,
          ENABLE=1.
        bits:
          - { bit: "0", name: ENABLE, default: 0,
              description: "1 = pop one stereo sample pair per AUDIO_TICK event (15.73 kS/s today); 0 = hold" }
          - { bit: "1", name: RESET, default: 1,
              description: "1 = hold both 7200 /RS low (FIFOs empty, pops suppressed); 0 = run" }
      - offset: 0x1F
        name: AUDIO_STATUS
        access: read
        width: 8
        description: |
          Audio FIFO status; no interrupt, poll it.
          EMPTY is the raw 7200 /EF pin, read like the joystick switches
          (nothing in PORTS acts on it): the last pair has been popped and
          the DACs hold it.  The level is otherwise dead-reckoned: the pop
          rate is locked to the pixel clock, and a missed frame is detected
          from the vsync latch, not from the FIFO.
        bits:
          - { bit: "0", name: EMPTY,
              description: "Live 7200 /EF: 1 = no pairs queued" }
          - { bit: "1", name: ENABLE,
              description: "Current AUDIO_CONTROL ENABLE state" }

  # 16-bit True IDE PIO: DATA is word offset 0x00; task-file registers are
  # byte-wide on D7-D0 at the odd offsets.  GLUE gates IOWR with AS.
  CF:
    part: "Compact Flash (True IDE)"
    description: "Storage via CF card in True IDE 16-bit PIO mode"
    address_range:
      base: 0xF40000
      size: 0x040000
      width: [8, 16]
    dtack:
      - 12000000: 7
      - 14000000: 7
      - 14318181: 7
      - 16000000: 8
      - 20000000: 12
    registers:
      - { offset: 0x00, name: DATA,         access: rw,    width: 16,
          description: "16-bit data port to/from the CF card" }
      - { offset: 0x03, name: ERROR,        access: read,  width: 8,
          description: "Error register; valid after a command error" }
      - { offset: 0x03, name: FEATURES,     access: write, width: 8,
          description: "Features register; written before issuing SET_FEATURES command" }
      - { offset: 0x05, name: SECTOR_COUNT, access: rw,    width: 8,
          description: "Number of sectors to transfer" }
      - { offset: 0x07, name: SECTOR_NUM,   access: rw,    width: 8,
          description: "LBA bits 7:0" }
      - { offset: 0x09, name: CYL_LO,       access: rw,    width: 8,
          description: "LBA bits 15:8" }
      - { offset: 0x0B, name: CYL_HI,       access: rw,    width: 8,
          description: "LBA bits 23:16" }
      - { offset: 0x0D, name: DRIVE_HEAD,   access: rw,    width: 8,
          description: "LBA bits 27:24 and drive select; OR with CF_DH_LBA for LBA mode" }
      - { offset: 0x0F, name: STATUS,       access: read,  width: 8,
          description: "Device status; poll BSY clear and DRQ set before data transfer" }
      - { offset: 0x0F, name: COMMAND,      access: write, width: 8,
          description: "Issue command; write after setting all other registers" }

  DUART:
    part: "XR68C681"
    description: "Console (Ch A) and second serial (Ch B), 100 Hz systick C/T, GP pins for flow control / DS3231 I2C"
    clock: 3686400
    # OP/IP pin wiring.  OP pins drive the COMPLEMENT of their OPR bits
    # (OPR_SET drives the pin LOW); levels below are PIN levels.
    #   OP0: ~RTS_A                              IP0: ~CTS_A
    #   OP1: ~RTS_B                              IP1: ~CTS_B
    #   OP2: RTC_SCL (DS3231 I2C clock, push-pull)
    #   OP3: RTC_SDA_DRIVE (N-FET gate: pin high pulls SDA low)
    #                                            IP2: RTC_SDA readback
    #                                            IP3: DS3231 ~INT
    #   OP4..OP7: -> TIMING pins 20, 21, 24, 25  IP4, IP5: spare
    # OP4..OP7 are a static firmware-settable configuration word for TIMING
    # (future raster/audio-rate select); unused today, and the OP reset state
    # (OPR = 0 -> pins HIGH, 1111) must remain today's behaviour.
    # Bus: ~CS from GLUE (nDUART_SELECT), DTACKN back to GLUE (nDUART_DTACK),
    # ~IACK tied high (autovectors), ~RESET from GLUE nDUART_RESET.
    address_range:
      base: 0xF80000
      size: 0x040000
      width: 8
    interrupt:
      level: 5
      signal: ~DUART_IRQ
    dtack: ~DUART_DTACK  # handshake: 68681 DTACKN
    berr_timeout: 256
    registers:
      - { offset: 0x01, name: MR1A,   access: rw,    width: 8,
          description: "Channel A mode register 1 (after reset or MR pointer reset)" }
      - { offset: 0x01, name: MR2A,   access: rw,    width: 8,
          description: "Channel A mode register 2 (second access after MR pointer reset)" }
      - offset: 0x03
        name: SRA
        access: read
        width: 8
        description: "Channel A status register"
        bits:
          - { bit: "0", name: RXRDY, description: "Receiver ready" }
          - { bit: "1", name: FFULL, description: "FIFO full" }
          - { bit: "2", name: TXRDY, description: "Transmitter ready" }
          - { bit: "3", name: TXEMT, description: "Transmitter empty" }
          - { bit: "4", name: OE,    description: "Overrun error" }
          - { bit: "5", name: PE,    description: "Parity error" }
          - { bit: "6", name: FE,    description: "Framing error" }
          - { bit: "7", name: RB,    description: "Received break" }
      - { offset: 0x03, name: CSRA,   access: write, width: 8,
          description: "Channel A clock select register" }
      - offset: 0x05
        name: CRA
        access: write
        width: 8
        description: "Channel A command register"
        bits:
          - { bit: "1:0", name: EC,  description: "Enable command: 0=no action, 1=enable RX, 2=disable RX" }
          - { bit: "3:2", name: TC,  description: "Transmitter command: 0=no action, 1=enable TX, 2=disable TX" }
          - { bit: "6:4", name: MC,  description: "Misc command: 1=reset MR ptr, 2=reset RX, 3=reset TX, 4=reset error, 5=reset break, 6=start break, 7=stop break" }
      - { offset: 0x07, name: RBA,    access: read,  width: 8,
          description: "Channel A receiver buffer (read to dequeue FIFO)" }
      - { offset: 0x07, name: TBA,    access: write, width: 8,
          description: "Channel A transmitter buffer (write to enqueue)" }
      - { offset: 0x09, name: IPCR,   access: read,  width: 8,
          description: "Input port change register (read clears interrupt)" }
      - offset: 0x09
        name: ACR
        access: write
        width: 8
        description: "Auxiliary control register (timer/counter mode, BRG set select)"
        bits:
          - { bit: "7",   name: BRG_SET,     description: "0 = BRG set 0; 1 = BRG set 1 (selects CSRA/CSRB rate table)" }
          - { bit: "6:4", name: CT_MODE,     description: "C/T mode + clock: 6=Timer X1/CLK, 7=Timer X1/CLK÷16, 3=Counter X1/CLK÷16" }
          - { bit: "3",   name: IP3_INT_EN,  description: "IP3 change-of-state IRQ enable" }
          - { bit: "2",   name: IP2_INT_EN,  description: "IP2 change-of-state IRQ enable" }
          - { bit: "1",   name: IP1_INT_EN,  description: "IP1 change-of-state IRQ enable" }
          - { bit: "0",   name: IP0_INT_EN,  description: "IP0 change-of-state IRQ enable" }
      - offset: 0x0B
        name: ISR
        access: read
        width: 8
        description: "Interrupt status register"
        bits:
          - { bit: "0", name: TXRDYA,      description: "Channel A TX ready" }
          - { bit: "1", name: RXRDYA,      description: "Channel A RX ready/FIFO full" }
          - { bit: "2", name: DELTA_BRKA,  description: "Channel A break change" }
          - { bit: "3", name: CTR_READY,   description: "Counter/timer ready" }
          - { bit: "4", name: TXRDYB,      description: "Channel B TX ready" }
          - { bit: "5", name: RXRDYB,      description: "Channel B RX ready/FIFO full" }
          - { bit: "6", name: DELTA_BRKB,  description: "Channel B break change" }
          - { bit: "7", name: IPC,         description: "Input port change" }
      - { offset: 0x0B, name: IMR,    access: write, width: 8,
          description: "Interrupt mask register (same bit layout as ISR; 1=enabled)" }
      - { offset: 0x0D, name: CUR,    access: read,  width: 8,
          description: "Counter/timer upper byte (current value)" }
      - { offset: 0x0D, name: CTUR,   access: write, width: 8,
          description: "Counter/timer upper preload register" }
      - { offset: 0x0F, name: CLR,    access: read,  width: 8,
          description: "Counter/timer lower byte (current value)" }
      - { offset: 0x0F, name: CTLR,   access: write, width: 8,
          description: "Counter/timer lower preload register" }
      - { offset: 0x11, name: MR1B,   access: rw,    width: 8,
          description: "Channel B mode register 1 (after reset or MR pointer reset)" }
      - { offset: 0x11, name: MR2B,   access: rw,    width: 8,
          description: "Channel B mode register 2 (second access after MR pointer reset)" }
      - { offset: 0x13, name: SRB,    access: read,  width: 8,
          description: "Channel B status register (same bit layout as SRA)" }
      - { offset: 0x13, name: CSRB,   access: write, width: 8,
          description: "Channel B clock select register" }
      - { offset: 0x15, name: CRB,    access: write, width: 8,
          description: "Channel B command register (same bit layout as CRA)" }
      - { offset: 0x17, name: RBB,    access: read,  width: 8,
          description: "Channel B receiver buffer (read to dequeue FIFO)" }
      - { offset: 0x17, name: TBB,    access: write, width: 8,
          description: "Channel B transmitter buffer (write to enqueue)" }
      - { offset: 0x19, name: IVR,    access: rw,    width: 8,
          description: "Interrupt vector register" }
      - { offset: 0x1B, name: IP,     access: read,  width: 8,
          description: "Input port (unlatched)" }
      - { offset: 0x1B, name: OPCR,   access: write, width: 8,
          description: "Output port configuration register" }
      - { offset: 0x1D, name: STARTCC, access: read, width: 8,
          description: "Start counter/timer command (read to start; data ignored)" }
      - { offset: 0x1D, name: OPR_SET, access: write, width: 8,
          description: "Output port bit set (1 bits set corresponding OP pins)" }
      - { offset: 0x1F, name: STOPCC,  access: read, width: 8,
          description: "Stop counter/timer command (read to stop; data ignored)" }
      - { offset: 0x1F, name: OPR_CLR, access: write, width: 8,
          description: "Output port bit reset (1 bits clear corresponding OP pins)" }

  # AUDIO has no CPU path.  The FIFO pair's data pins sit on D[15:0] and the
  # only /W is ENGINE's AUDIO_FIFO_W deposit strobe (ENGINE_SIGNAL_AUDIO_FIFO_W):
  # one word per stereo pair, L = D15-D8, R = D7-D0, unsigned 8-bit
  # /R comes from PORTS once per AUDIO_TICK event
  # (AUDIO_SAMPLES_PER_SECOND) while PORTS AUDIO_CONTROL.ENABLE is set;
  # /RS of both chips from PORTS (AUDIO_CONTROL.RESET); /EF of the pair goes
  # to PORTS as AUDIO_STATUS.EMPTY.  /HF is unconnected.  No interrupt.
  AUDIO:
    part: "2x IDT7200 FIFO + 2x 8-bit R2R DAC"
    description: "Stereo FIFO audio output, filled only by ENGINE AUDIO_FIFO_W deposits, drained by PORTS at the AUDIO_TICK rate"

constants:
  CF_STATUS_BSY:   0x80
  CF_STATUS_DRDY:  0x40
  CF_STATUS_DRQ:   0x08
  CF_STATUS_ERR:   0x01
  CF_CMD_READ_SECTORS:  0x20
  CF_CMD_WRITE_SECTORS: 0x30
  CF_CMD_IDENTIFY:      0xEC
  CF_CMD_SET_FEATURES:  0xEF
  CF_CMD_SET_8BIT:      0x01   # rev-1 8-bit PIO only; unused with the 16-bit DATA port
  CF_DH_LBA:            0xE0
  PS2_RX_QUEUE_SIZE:    64

  # Audio FIFO geometry (2x IDT7200, 256 x 9, one per channel): 256 pairs =
  # 16.3 ms at AUDIO_SAMPLES_PER_SECOND; fills are sized against this.
  AUDIO_FIFO_DEPTH:          256
  AUDIO_SAMPLES_PER_SECOND:  15734   # TIMING AUDIO_TICK falling edges: every second 31.469 kHz line
  PADDLE_TICKS_PER_SECOND:   15734   # TIMING PADDLE_TICK falling edges: same, the 2600 scanline rate

  # DUART OP/IP masks (see the DUART pin wiring).  OP pins drive the
  # COMPLEMENT of their OPR bits; RTC_SDA_DRIVE inverts again through the
  # N-FET (pin high = SDA low).  OP4..OP7 have no masks until TIMING uses them.
  DUART_OP_RTC_SCL:        0x04   # OP2
  DUART_OP_RTC_SDA_DRIVE:  0x08   # OP3
  DUART_IP_RTC_SDA:        0x04   # IP2
  DUART_IP_RTC_NINT:       0x08   # IP3
  RTC_I2C_ADDR:            0x68   # DS3231 7-bit I2C address

  # PS/2 TX parity is carried in address bit 1 of the TX_DATA registers.
  PS2_TX_DATA_PARITY:   0x02

  # ENGINE bus-arbitration burst: words per BR/BGACK cycle.  Shorter than a
  # scanline so one burst (~2.86 us at 2 CPUCLK/word) cannot fill an hblank
  # (~6.35 us); long enough to amortize the ~10-cycle handshake.
  ENGINE_WORDS_PER_BURST: 20

  # Frame interrupt level (TIMING nVSYNC_IRQ latched in GLUE).
  VSYNC_IRQ_LEVEL: 6

  # --- Video path: numbers more than one component must agree on.  Bit-level
  # VIDCMD/descriptor encodings stay in super-engine/descriptor.h; semantics
  # in vidcmd-spec.md; implementations in cpld/{engine,compositor,pixel}.

  # ENGINE descriptor word0 one-hot deposit strobe mask bits (3 assigned + 1 spare).
  ENGINE_SIGNAL_PIXELS_FIFO_W:  0x01
  ENGINE_SIGNAL_VIDCMD_FIFO_W:  0x02
  ENGINE_SIGNAL_AUDIO_FIFO_W:   0x04

  # VIDCMD SET target numbering {1, ttt, value[11:0]}: 0..1 COMPOSITOR-local,
  # 2..6 forwarded to PIXEL over the valid/target/commit handshake, 7 spare.
  # Target 0 writes cmp_color1 and target 1 writes cmp_color0 (see issues).
  VIDCMD_SET_CMP_COLOR1:     0
  VIDCMD_SET_CMP_COLOR0:     1
  VIDCMD_SET_PIX_PAL_FG:     2
  VIDCMD_SET_PIX_PAL_BG:     3
  VIDCMD_SET_PIX_HAM_HELD:   4
  VIDCMD_SET_PIX_MODE:       5
  VIDCMD_SET_PIX_PIXEL_SKIP: 6

  # Stream FIFOs: 2x IDT7200 256x9 per stream (VIDCMD ganged 16-bit;
  # PIXELS byte-interleaved shared-Q pair).
  PIXELS_FIFO_WORDS: 256
  VIDCMD_FIFO_WORDS: 256

  # Pixel stream lengths (no in-band header): 1bpp = 1 bit/px, 2bpp
  # micro-HAM / indexed = 2 stream bits per px clock.
  PIXELS_WORDS_PER_LINE_1BPP: 40
  PIXELS_WORDS_PER_LINE_HAM:  80

  # Pipeline lead constants -- DERIVED from measured stage latencies, not
  # tuned; TIMING fires its comparators early by exactly these amounts and
  # timing.v localparams must stay equal to them.
  COMPOSITOR_LEAD:    2    # consume edge + registered RGB_OUT (compositor_tb)
  PIXEL_OUT_LEAD:     1    # ham_held -> registered RGB_OUT inside PIXEL
  TIMING_SPLIT_LEAD:  1    # TIMING->PIXEL registered strobe hop
  DAC_LEAD:           4    # sum of the above: sync compares shift by this
  PIXEL_PRELOAD_LEAD: 16   # hblank fetch lead: 2 first byte + 2 skip-discard
                           # + 7 alignment shifts = 11, rounded up

# Firmware<->application syscall ABI: TRAP #15, call number in d0, up to
# three args in d1/d2/d3 (pointers as longs), result in d0; d0 < 0 is -errno.
# d0-d3 are clobbered.  Shared by sys_dispatch (firmware) and
# apps/lib/syscalls.c (app stubs).
syscalls:
  trap: 15
  calls:
    - name: EXIT
      number: 0
      description: "Terminate the application and return control to the firmware."
    - name: WRITE
      number: 1
      description: "write(fd in d1, buf in d2, len in d3) to the console or a file."
    - name: READ
      number: 2
      description: "read(fd in d1, buf in d2, len in d3) from the console or a file."
    - name: OPEN
      number: 3
      description: "open(path in d1, flags in d2, mode in d3) and return a file descriptor."
    - name: CLOSE
      number: 4
      description: "close(fd in d1) a previously opened file descriptor."
    - name: LSEEK
      number: 5
      description: "lseek(fd in d1, offset in d2, whence in d3) within an open file."
    - name: FSTAT
      number: 6
      description: "fstat(fd in d1, struct stat in d2) for an open file descriptor."
    - name: ISATTY
      number: 7
      description: "isatty(fd in d1) returns nonzero if the descriptor is a terminal."
    - name: STAT
      number: 8
      description: "stat(path in d1, struct stat in d2) for a named file."
    - name: INPUTREADY
      number: 9
      description: "Return 1 if console input is ready so a read from the console would not block."
    - name: READDIR
      number: 10
      description: "readdir(path in d1, index in d2, entry buffer in d3) fills one directory entry and returns 0, or 1 past the end."
    - name: GETTICKS
      number: 11
      description: "Return milliseconds since boot as an unsigned 32-bit count that wraps."
    - name: GETTIME
      number: 12
      description: "Return seconds since the Unix epoch derived from the boot epoch plus milliseconds since boot."
    # Direct video ownership contract and GriffinVideoDirectInfo: griffin_abi.h.
    - name: VIDEO_DIRECT_START
      number: 13
      description: "Take direct control of the video ENGINE: d1 points to a GriffinVideoDirectInfo the firmware fills with the app descriptor-table region."
    - name: VIDEO_DIRECT_END
      number: 14
      description: "Return the video ENGINE to the firmware console."

# Rev 1 board reworks (applied to board/board-pcb-rev-1.distilled.txt).
bodges:
  - "Reroute A6 pad on U12 to A18"
  - "Route freed GLUE pin 75 to CPU ~VPA"
  - "Pull up CPU HALT with 4.7K to nearby CPU +5V"

# Open items only.
issues:
  - "FIFO desync observability: the display-list ENGINE does not drive the 7200 9th-bit toggle, so there is no desync detector in rev 2.  Decide whether a CPU-pollable status is wanted or frame-bounded /RS recovery is enough."
  - "What raises ~ENGINE_IRQ is unspecified; the pin is routed but always 1."
  - "Micro-HAM stream encoding is not captured in the YAML."
  - "VIDCMD SET target 0 writes cmp_color1 and target 1 writes cmp_color0.  Swapping the target NUMBERS to match the colour numbers is a wire-contract change, not yet decided."
  - "Only one raster mode (640x480 in 800x525 @ 60) is specified.  Alternate rasters (the DUART OP4..OP7 selector into TIMING) have no video_timing entry and no consumer contract."
  - "The PIXELS and VIDCMD stream FIFOs (ENGINE -> PIXEL / COMPOSITOR) are described in comments and constants, not as first-class entries."
  - "BERR in 0x400000-0x7FFFFF, 0xC00000-0xCFFFFF and 0xE00000-0xEFFFFF is by DTACK timeout (no decode); state whether that is the intended contract."
  - "BERR in unassigned IO spaces is unspecified."
  - "Writes to bank 1 during ROM overlay are unspecified."
  - "Other RAM areas during overlay: probably pass through except ROM space; should ROM then be limited to the image size with BERR outside it?"
  - "IO ports repeating (mirroring) within their range is not stated."
  - "DTACK ownership for ENGINE is unstated; probably GLUE should continue to own DTACK."
  - "Per-peripheral interrupt.level is given but the YAML never states that GLUE encodes IPL2:0 and asserts ~VPA on IACK, nor which IRQ signals are physical nets (ENGINE, DUART, PORTS -> GLUE) versus internal (~PS2_IRQ never leaves GLUE); a netlist diff will expect a ~PS2_IRQ net."
  - "Not captured here: the two oscillators, SYSCLK into a GCLK on each CPLD, and the ~HALT open-drain contract.  A clocks: section or one more interfaces entry would make them checkable."
  - "ENGINE's nSIGNAL strobe width and bit naming in engine.v (7 bits, rev-1 names) disagree with the ENGINE_SIGNAL_* constants (3 assigned + 1 spare); reconcile before the ENGINE pinout is used for the audio /W net."

# Chip-to-chip interface contracts: parts, nets, and pinned numbers.  KiCad
# is the connectivity authority; this is the intent layer.  Read as a parts
# checklist before schematic entry; diff kicad_netlist_summary_2.py output
# against it after.  The per-chip contracts of the video chain are under
# their peripheral entries above.
interfaces:
  - |
    VGA R4G4B4 output stage: COMPOSITOR -> 2x 74AC541 -> weighted-resistor
    DAC -> DE-15.  14 CPLD signals: R[3:0], G[3:0], B[3:0] from COMPOSITOR,
    HSYNC, VSYNC from TIMING.  U-a: R[3:0] + G[3:0]; U-b: B[3:0] + HSYNC +
    VSYNC.  Both /OE grounded.  Buffers are mandatory (ATF1508AS VOH is
    specified only to -2 mA; the MSB sources ~8.6 mA).
    DAC per channel (x3): binary-weighted ladder + shunt to ground.  bit3 =
    2x 1k parallel, bit2 = 1k, bit1 = 2x 1k series, bit0 = 3.9k, shunt =
    100R; 1k are 1% metal film (same batch), 3.9k may be 5%.  FS ~= 0.693 V
    loaded, Zth ~= 72.7R, worst-case systematic error ~= 0.03 LSB.
    Syncs: buffer -> 100R series -> DE-15 pins 13/14; no termination.
    DE-15: R=1, G=2, B=3, HS=13, VS=14; 5,6,7,8,10 + shell -> GND.
    BOM: 21x 1k 1%, 3x 3.9k, 5x 100R, 2x 74AC541.
    Layout: ladders + shunts at the DE-15, not at the buffers; 12 DAC traces
    short and roughly matched; solid ground return from shunts to shell.
  - |
    Stream FIFO parts: all three streams use 2x IDT7200 (256x9) -- PIXELS
    byte-interleaved shared-Q pair (/RE from PIXEL), VIDCMD ganged 16-bit
    (/RE from COMPOSITOR), AUDIO one per channel (/RE from PORTS).  All /W
    strobes come from ENGINE's deposit outputs; data pins on D[15:0].
    PIXELS and VIDCMD /RS from TIMING nRS; AUDIO /RS from PORTS
    (AUDIO_CONTROL.RESET), AUDIO /EF to PORTS, /HF unconnected.  XI/XO cascade is an
    unpopulated-footprint option if depth is ever needed.
  - |
    FIFO control strobes: series source termination at the driver end on
    every /RE and /W line of every 7200 (PIXELS, VIDCMD, AUDIO).
  - |
    TIMING nVSYNC_IRQ -> GLUE nVSYNC: the level-6 frame
    IRQ.  GLUE edge-latches it with W1C ack (VSYNC_STATUS/VSYNC_CLEAR at
    0x17) because TIMING has no CPU bus to host an ack register.
  - |
    Power entry: 5.5mm x 2.1mm center-positive barrel jack, regulated 5V
    >= 2.5A, inline switch; silkscreen "5V regulated 2.5A+ center positive".
    Supervisor: DS1233D-5 (open-drain RST, internal 5k pull-up, trip
    4.50-4.74 V, 350 ms stretch, IOL 8 mA), wire-OR on ~RESET with the user
    button, the CPU's RESET-instruction driver, and the debug-header master.
    No RC on the reset net.  Bring-up gate: rail >= 4.85 V at the supervisor
    under full load, else DS1233D-10 or trim the supply.
  - |
    Carried forward from Rev 1: the XR68C681 DUART with ~CS from GLUE
    (nDUART_SELECT) and DTACKN returned to GLUE (nDUART_DTACK).
