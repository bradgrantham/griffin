# chip-to-chip interface contracts.  Each entry is one interface with
# its support parts and the reason each part exists, recorded when the
# decision was made rather than reconstructed at schematic time.  KiCad
# remains the connectivity authority; this section is the intent layer.
# Capture ritual: read as a parts checklist BEFORE schematic entry; diff
# kicad_netlist_summary_2.py output against these annotations AFTER.
interfaces:
  - |
    VGA R4G4B4 output stage (design handoff 2026-08-12).
    Signal chain: ATF1508AS (5V AS part) -> 2x 74AC541 -> weighted-resistor
    DAC -> DE-15.  14 signals from CPLD: R[3:0], G[3:0], B[3:0], HSYNC, VSYNC.
    - U-a (74AC541): R[3:0] + G[3:0].  U-b (74AC541): B[3:0] + HSYNC + VSYNC
      (2 sections spare).  Both /OE pins grounded; 100nF X7R at each VCC;
      VCC = +5V.
    - Buffers are MANDATORY, not optional: ATF1508AS VOH is only specified to
      -2mA and the MSB sources ~8.6mA in this network; direct drive produces
      code-dependent nonlinearity.  Do not remove them to save a chip.
    DAC topology (per channel, x3): binary-weighted ladder + shunt to ground;
    the shunt is what lets a 5V CMOS rail hit both 0.7V full-scale and ~75R
    back-termination simultaneously.  Ideal values 500/1k/2k/4k weights,
    105R shunt.  Chosen E12-only implementation (precision spent proportional
    to bit weight):
    - bit3: 2x 1k in parallel (= 500R exact ratio)
    - bit2: 1x 1k
    - bit1: 2x 1k in series (= 2k exact ratio)
    - bit0: 1x 3.9k single (2.6% weight error = 0.03 LSB; do not double up)
    - shunt: 1x 100R
    All 1k are 1% metal film, ideally same batch/reel (tolerance tracking);
    3.9k may be 5%.  Resulting electricals: FS ~= 0.693V loaded, Zth ~= 72.7R,
    worst-case systematic error ~= 0.03 LSB.  74AC541 Rout (~10-15R) folds
    into series values; optionally trim bit3 toward 487R equivalent if
    measured FS matters, otherwise ignore.
    Syncs: buffer output -> 100R series -> DE-15 pins 13/14.  No DAC, no
    termination.  Connector: DE-15 R=1, G=2, B=3, HS=13, VS=14; pins
    5,6,7,8,10 + shell -> GND.
    Resistor BOM: 21x 1k 1% (ladders), 3x 3.9k (bit0), 3x 100R (shunts),
    2x 100R (syncs) = 29 resistors, 3 stocked values.  Plus 2x 74AC541.
    Layout: ladders + shunts placed at the DE-15, not at the buffers; 12 DAC
    traces short and roughly matched length (bit skew smears edges); solid
    ground return between shunt grounds and connector shell.  CPLD pin
    assignment unconstrained by this design; assign per fitter/board
    convenience.
  - |
    VIDCMD FIFO read port (COMPOSITOR <- 2x IDT7200L15, shared /RE).
    One 74AC00 (or 74F00 pending the timing re-derivation) shapes /RE so
    VIDCMD sustains one word per 25.175MHz pixel clock — a registered CPLD
    output can only change once per clock, so a full read cycle inside one
    39.7ns tick needs the clock itself to supply the mid-tick edges:
    - gate A: /RE = NAND(want_pop, PIXEL_CLK)
    - gate B: inverts PIXEL_CLK for the falling-edge want_pop register clock
      (prevents runt /RE pulses when want_pop changes mid-high-phase)
    - gates C, D: spare (candidate: same shaping for the PIXELS FIFO /RE)
    Decision 2026-08-10; parameter table (IDT7200L15 tA/tRC/tRPW/tRR,
    ATF1508AS tCO/tSU, gate tPD) still to be pinned from datasheets before
    schematic capture — see feedback_timing_discipline.  Fallback if margins
    fail: omit the gate, registered /RE, 2 slots/word cadence (1-px VIDCMD
    spans then render 2px wide).
  - |
    VIDCMD FIFO empty flag -> COMPOSITOR (new pin vs Rev 1).
    /EF from the VIDCMD FIFOs routes to a COMPOSITOR input; synchronized
    on-chip with an asymmetric guard (2-FF sync governs the asynchronous
    RISE from ENGINE-domain writes; the raw flag governs the FALL caused by
    COMPOSITOR's own clock-aligned read).  Hardware requirement this
    creates: FIFO tEFL from /RE must settle within one pixel clock minus
    setup (~25ns typ on L15 vs 39.7ns — verify at worst case, and re-verify
    if the 1-word/clock /RE shaping is adopted, which halves the budget).
  - |
    Stream FIFO part unification (2026-08-13): all three streams use 2x
    IDT7200 (256x9) — PIXELS byte-interleaved shared-Q pair, VIDCMD ganged
    16-bit, AUDIO one per channel.  The 7202s originally specified for
    AUDIO are hard to source; 256 pairs = 16.3 ms of buffer with half-full
    at 128 pairs (~8 ms of refill runway, ~123 Hz IRQ) covers the measured
    use cases (display-list fill held 49..93 pairs).  The 7200 family
    cascades via XI/XO if depth is ever needed — an unpopulated-footprint
    option, not a redesign.
  - |
    FIFO control strobes: series source termination on every /RE and /W
    line at the driver end (all 7200 FIFOs — PIXELS, VIDCMD, AUDIO).
    Promotes the Rev 1 fix to design: the Rev 1 7200 /RE bodge wires rang
    and needed 10pF band-aid caps at the FIFO pins; Rev 2 terminates
    properly at the source instead.
  - |
    TIMING VSYNC -> GLUE level-6 frame IRQ (decided 2026-08-13).
    Net: TIMING's VSYNC output tee'd to GLUE's pin 65 (the rev-1 ~VIDEO_IRQ
    input, renamed nVSYNC), tapped BEFORE the 74AC541 sync buffer so GLUE
    sees the raw 5V CPLD output.  Zero new pins on either chip.  The latch
    and the W1C acknowledge live in GLUE (VSYNC_STATUS/VSYNC_CLEAR at
    offset 0x17) because TIMING has no CPU bus to host an ack register —
    a raw level would double-fire or be missed, so GLUE edge-detects the
    synchronized assertion and holds the IRQ until the ISR clears it.
  - |
    TIMING -> COMPOSITOR contract: H_ACTIVE (and the /RS vsync pulse) must
    LEAD the visible window by 2 pixel clocks — COMPOSITOR's consume-edge
    plus registered-RGB_OUT pipeline is exactly 2 clocks (measured in the
    compositor testbench).  Constrains whichever chip generates timing
    (TIMING may be combined with PIXEL in one ATF1508); not a discrete
    part, recorded here so the timing chip's counters are offset by design
    rather than trimmed by bodge.
  - |
    Carried forward from Rev 1 unchanged: 74155 dual 2-to-4 decoder fans
    ~IO_WR_EN out by A19:18 (write section: ~AUDIO_W etc.; read section
    reserved), and the XR68C681 DUART on its DIP carrier with the ~CS
    routing from GLUE and DTACKN return (see the DUART issue entry above —
    resolve that checklist gap during Rev 2 capture).

