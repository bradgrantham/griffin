# Griffin hardware definition -- the source for (1) CPU interaction: memory
# map, register bitfields and their legal values, constants CPU code writes to
# and between components; (2) bitfile creation: the same bitfields and the
# structural rules the CPLDs implement; (3) high-level schematic validation:
# which chip drives which net.  Machine-readable fields feed codegen.py
# (C/C++, GAS, ld, Verilog headers); comments state only the contracts no
# implementation states.  Rationale, history and measurements: griffin.log.

project:
  name: Griffin
  cpu: MC68010    # 68000 is a drop-in
  clock_hz: 14000000
  interrupt_mode: autovector

peripherals:
  GLUE:
    part: ATF1508AS
    description: "System glue logic, PS/2 keyboard, ENGINE and CF card status readback"
    address_range:
      base: 0xF00000
      size: 0x040000
      width: 8
    dtack:
      - 12000000: 0
      - 14000000: 0
      - 14318181: 0
      - 16000000: 0
      - 20000000: 0
    interrupt:
      level: 4
      signal: ~PS2_IRQ
    # One timeout for every region, handshake peripherals included: a bus
    # cycle (FC != 111) with no DTACK by this SYSCLK rising edge after ~AS
    # asserts gets ~BERR.  Fixed-wait-state thresholds are clamped below it.
    berr_timeout_clocks: 15
    registers:
      - offset: 0x01
        name: DEBUG_OUT
        access: write
        width: 8
        description: |
          Set or clear DEBUG_OUT signal (debug LED and test point output).
          While ~HALT is low GLUE overrides the pin with a ~1.9 Hz blink
          (vsync/32); the register value returns when ~HALT releases.
        bits:
          - { bit: "0", name: OUT, description: "DEBUG_OUT drive level" }
      - offset: 0x07
        name: CONFIG
        access: write
        width: 8
        description: "GLUE configuration register"
        bits:
          - { bit: "0", name: ROM_OVERLAY_DISABLE, default: 0,
              description: "Write 1 to disable ROM overlay and unmap ROM from RAM bank 1 address space" }
          - { bit: "1", name: FLASH_WE_EN, default: 0,
              description: "Write 1 to enable the ~ROM_WE strobe so ROM-window word writes reach the flash (JEDEC program/erase); 0 write-protects flash" }
          - { bit: "2", name: VSYNC_IRQ_EN, default: 0,
              description: "Write 1 to let VSYNC_PENDING assert the level-6 IRQ; 0 suppresses only the IRQ, so VSYNC_STATUS/VSYNC_CLEAR still work for polling" }
          - { bit: "3", name: CF_IRQ_EN, default: 0,
              description: "Write 1 to let CF INTRQ assert the level-1 IRQ; 0 leaves CF_PINS.INTRQ readable but raises no interrupt" }
      - offset: 0x09
        name: PS2_TX_DATA
        access: write
        width: 8
        description: |
          Byte to transmit host->device; the write itself starts the frame.
          The request-to-send clock inhibit is not done in hardware: hold
          PS2_CLK low >= 100 us via PS2_CTRL.CLK first.  Bits are shifted
          on device PS2_CLK falling edges; the device ACK lands in TX_ACK
          and TX_DONE raises the IRQ.  Parity is not computed in hardware:
          address bit 1 carries it, so write PS2_TX_DATA for parity 0 or
          PS2_TX_DATA + PS2_TX_DATA_PARITY (0x0B) for parity 1.  Ignored
          while a TX or RX frame is in progress.
        bits:
          - { bit: "7:0", name: DATA, description: "Data byte to send (write triggers TX)" }
      - offset: 0x11
        name: PS2_STATUS
        access: read
        width: 8
        description: |
          PS/2 frame-engine status.
          One IRQ per assembled RX frame (RX_READY) or completed TX
          (TX_DONE); both W1C via PS2_CLEAR.  Parity is not checked in
          hardware: firmware checks RX_PARITY.
        bits:
          - { bit: "0", name: RX_READY,
              description: "1 = a received byte is in PS2_RX_DATA; asserts the IRQ" }
          - { bit: "1", name: TX_DONE,
              description: "1 = host->device frame finished; asserts the IRQ" }
          - { bit: "2", name: TX_ACK,
              description: "Device ACK sampled on the final clock of the last TX (0 = acknowledged)" }
          - { bit: "3", name: RX_PARITY,
              description: "Received parity bit of the latched byte (not checked in hardware)" }
          - { bit: "4", name: RX_FRAME_ERR,
              description: "1 = framing error" }
          - { bit: "5", name: DATA_LIVE,
              description: "Unlatched synchronized PS2_DATA pin state (debug)" }
          - { bit: "6", name: CLK_LIVE,
              description: "Debounced PS2_CLK level the frame engine clocks on, not the raw pin (debug)" }
      - offset: 0x11
        name: PS2_CLEAR
        access: write
        width: 8
        description: |
          Write-1-to-clear for PS2_STATUS latched flags / IRQ ack.
          The IRQ de-asserts on the same cycle once both RX_READY and
          TX_DONE are clear.
        bits:
          - { bit: "0", name: RX_READY, description: "Write 1 to clear RX_READY (RX byte ISR ack)" }
          - { bit: "1", name: TX_DONE,  description: "Write 1 to clear TX_DONE (TX completion ISR ack)" }
      - offset: 0x13
        name: PS2_CTRL
        access: write
        width: 8
        description: |
          Open-drain drive control for PS2_CLK and PS2_DATA for the TX inhibit handshake.
          CLK is ignored while a TX frame is in progress (the engine owns
          the pins).
        bits:
          - { bit: "0", name: CLK,
              description: "1 = drive PS2_CLK low (inhibit / request-to-send)" }
          - { bit: "1", name: DATA,
              description: "1 = drive PS2_DATA low" }
      - offset: 0x15
        name: PS2_RX_DATA
        access: read
        width: 8
        description: "Assembled PS/2 data byte; valid while RX_READY is set."
        bits:
          - { bit: "7:0", name: DATA, description: "Received scancode byte" }
      - offset: 0x17
        name: VSYNC_STATUS
        access: read
        width: 8
        description: |
          Latched vsync frame interrupt status.
          GLUE latches the assertion edge of PIXEL's nVSYNC_IRQ; while
          CONFIG.VSYNC_IRQ_EN is set the latch asserts the level-6 IRQ
          until cleared via VSYNC_CLEAR.  Latch and readback are
          unconditional, so firmware may poll and acknowledge with no ISR.
        bits:
          - { bit: "0", name: VSYNC_PENDING,
              description: "1 = a vsync edge has been latched; W1C via VSYNC_CLEAR" }
      - offset: 0x17
        name: VSYNC_CLEAR
        access: write
        width: 8
        description: "Write-1-to-clear for VSYNC_PENDING / level-6 IRQ ack."
        bits:
          - { bit: "0", name: VSYNC_PENDING, description: "Write 1 to clear VSYNC_PENDING (vsync ISR ack)" }
      - offset: 0x19
        name: ENGINE_STATUS
        access: read
        width: 8
        description: |
          Display-list ENGINE state, read back through GLUE because ENGINE reads see the open bus.
          ACTIVE and WAITING are ENGINE's registered status wires, one
          SYSCLK behind its state machine; IRQ is the ~ENGINE_IRQ net.
          Idle or aborted = 000, running = 001, parked in a wait_hblank
          descriptor = 011, finished by stop_after and not yet
          acknowledged = 100 (the list disarms itself).
        bits:
          - { bit: "0", name: ACTIVE,
              description: "1 = a list is armed and has not stopped or been aborted (ENGINE dma_en)" }
          - { bit: "1", name: WAITING,
              description: "1 = ENGINE has released the bus and is waiting for PIXEL's HBLANK rising edge" }
          - { bit: "2", name: IRQ,
              description: "1 = ~ENGINE_IRQ is asserted" }
      - offset: 0x1B
        name: CF_PINS
        access: read
        width: 8
        description: |
          CF card sideband pin levels, read raw.
          INTRQ is the level-1 interrupt when CONFIG bit CF_IRQ_EN is set.
          GLUE withholds the CF DTACK while IORDY is low, up to the BERR
          timeout.
        bits:
          - { bit: "0", name: INTRQ, description: "Live CF INTRQ level" }
          - { bit: "1", name: IORDY, description: "Live CF IORDY level (1 = ready)" }

  # Decode: A23 & ~A22; the 1MB image mirrors 4x through the 4MB window.
  # At reset ROM is also overlaid over RAM bank 1 until CONFIG.ROM_OVERLAY_DISABLE.
  # In-circuit reflash: GLUE asserts ~ROM_WE to both chips' WE# only for
  # (A23 & ~A22) & ~R/W & AS & UDS & LDS & CONFIG.FLASH_WE_EN -- word writes
  # only (keeps the x8 pair in lockstep), raw region only (overlay writes
  # never reach flash), locked at reset.  Both chips see the same command
  # byte in each lane; chip A0 is CPU A1, so JEDEC chip addresses
  # 0x5555/0x2AAA are CPU 0x80AAAA/0x805554.  Sector = 4KB/chip = 8KB CPU,
  # 8KB aligned.  Flasher must run from RAM (.ramtext) with the overlay off.
  ROM:
    part: "2x SST39SF040-70 (512Kx8 DIP-32 5V NOR flash, socketed; 1MB total)"
    address_range:
      base: 0x800000
      size: 0x100000
      window: 0x400000
      width: 16
    dtack:
      - 12000000: 1
      - 14000000: 1
      - 14318181: 1
      - 16000000: 1
      - 20000000: 1
    linker:
      section: rom

  # 4 banks x 1MB, each a pair of AS6C4008.  GLUE decodes nRAM_[1-4]_SEL
  # from A21:20 within A23:22 == 00 and drives the WRITE_LO/WRITE_HI byte
  # strobes.  All four banks are always populated.
  RAM_BANK_1:
    part: "2x AS6C4008"
    address_range:
      base: 0x000000
      size: 0x100000
      width: 16
    dtack:
      - 12000000: 0
      - 14000000: 0
      - 14318181: 0
      - 16000000: 0
      - 20000000: 1
    linker:
      section: ram

  RAM_BANK_2:
    part: "2x AS6C4008"
    address_range:
      base: 0x100000
      size: 0x100000
      width: 16
    dtack:
      - 12000000: 0
      - 14000000: 0
      - 14318181: 0
      - 16000000: 0
      - 20000000: 1
    linker:
      section: ram

  RAM_BANK_3:
    part: "2x AS6C4008"
    address_range:
      base: 0x200000
      size: 0x100000
      width: 16
    dtack:
      - 12000000: 0
      - 14000000: 0
      - 14318181: 0
      - 16000000: 0
      - 20000000: 1
    linker:
      section: ram

  RAM_BANK_4:
    part: "2x AS6C4008"
    address_range:
      base: 0x300000
      size: 0x100000
      width: 16
    dtack:
      - 12000000: 0
      - 14000000: 0
      - 14318181: 0
      - 16000000: 0
      - 20000000: 1
    linker:
      section: ram

  # nENGINE_SELECT comes from GLUE, which also owns DTACK for the CPU's
  # DESC/CTRL writes (0 wait states); ENGINE has no DTACK pin.  As a master
  # it does not sample DTACK either: every source it reads is 0-wait-state
  # SRAM selected combinationally from the address.
  # Write-only MMIO decoded on A[2:1] with LDS; reads see the open bus, so
  # ENGINE's state is read through GLUE ENGINE_STATUS.
  # ENGINE is a bus master: each 4-word descriptor reads count words from
  # any address and pulses one active-low deposit strobe per word, chosen
  # by the descriptor's destination code (ENGINE_DEST_*, decoded on chip):
  # nPIXELS_FIFO_W and nVIDCMD_FIFO_W are the /W pins of the two video FIFO
  # pairs, nAUDCTL_FIFO_W and nSAMPLES0..3_FIFO_W the /W pins of the five
  # byte-wide AUDIO FIFOs (see AUDIO and interfaces, Stream FIFO parts).
  # Code 0 strobes nothing and only spends the bus time.
  # ~ENGINE_IRQ asserts when a stop_after descriptor completes and clears on
  # any DESC or CTRL write.
  # Descriptors themselves are read only from the top 64K of RAM.
  # wait_hblank descriptors wait for the rising edge of PIXEL's HBLANK.
  # Descriptor format and strobe semantics: super-engine/descriptor.h and
  # vidcmd-spec.md.
  ENGINE:
    part: ATF1508AS
    description: "Display-list DMA engine walking 4-word descriptors from the top 64K of RAM"
    address_range:
      base: 0xD00000
      size: 0x100000
      width: [8, 16]
    dtack:
      - 12000000: 0
      - 14000000: 0
      - 14318181: 0
      - 16000000: 0
      - 20000000: 0
    interrupt:
      level: 3
      signal: ~ENGINE_IRQ
    registers:
      - offset: 0x02
        name: DESC
        access: write
        width: 16
        description: |
          Descriptor word address within RAM's top 64K; writing arms DMA.
          Byte address = 0x3F0000 + 2*ADDR; descriptors are 4-word aligned.
        bits:
          - { bit: "14:0", name: ADDR,
              description: "Word address of the first descriptor within the top 64K of RAM" }
      - offset: 0x05
        name: CTRL
        access: write
        width: 8
        description: |
          DMA enable and abort; any write clears a pending ~ENGINE_IRQ.
          A stop_after descriptor clears ENABLE itself at list end, so the
          usual IRQ ack is CTRL=0 from the ISR.
        bits:
          - { bit: "0", name: ENABLE, default: 0,
              description: "1 = run the armed list; 0 = abort and release the bus" }

  # None of PIXEL -> COMPOSITOR -> DAC is on the CPU bus; the CPU reaches
  # them only through ENGINE's PIXELS/VIDCMD FIFO streams.  The frame IRQ is
  # PIXEL's nVSYNC_IRQ latched in GLUE (VSYNC_STATUS/VSYNC_CLEAR).

  # PIXEL (cpld/pixel/pixel.v) is both the raster time base and the PIXELS
  # stream unpacker.
  # Raster output contracts, enforced by
  # cpld/pixel/timing_tb.v (`make timing-sim`) against the merged top level:
  # - nRS: 8 pixel clocks at the top of the vsync line (v_cnt==V_SYNC_START
  #   & h_cnt<8).  Consumers: COMPOSITOR machine reset (GCLR) and /RS of the
  #   four video-stream FIFO chips; the 7200 needs /W and /RE inactive from
  #   tRSS 15 ns before its rise to tRSR 10 ns after, so ENGINE video-write
  #   descriptors must finish before vsync (audio strobes exempt).
  #   nRS is COMPOSITOR's ONLY reset input, so between power-up and the first
  #   vsync nothing but the ATF1508AS POWER_RESET feature defines its state:
  #   the fitter's power_reset strategy flag is load-bearing there, and the
  #   first frame after power-up is not a defined picture.
  # - H_ACTIVE: leads the visible window by COMPOSITOR_LEAD (2) pixel clocks.
  #   Consumer: COMPOSITOR slot gating.
  # - PIX_CONSUME / PIX_PRELOAD / PIX_LAST: internal registered strobes, one
  #   clock late (TIMING_SPLIT_LEAD).  PIX_CONSUME = the 640 consumption
  #   clocks of a visible line; PIX_LAST = its last 8 (h_cnt[9:3]==79), the
  #   end-of-line fetch cutoff window; PIX_PRELOAD = one clock at
  #   H_TOTAL - PIXEL_PRELOAD_LEAD before a visible line.
  # - Sync compares shift late by DAC_LEAD (4); timing.v localparams must
  #   equal the lead constants below.
  # - HBLANK -> ENGINE and AUDIO: registered h_cnt >= 640, high for 640..799 on
  #   EVERY line, visible or blank, rising on the clock PIX_CONSUME falls.
  #   ENGINE 2-FF synchronizes it and wait_hblank descriptors wait for the
  #   rising edge, the start of the 160-clock blank budgeted in
  #   descriptor.h HBLANK_SYSCLK.
  # - nVSYNC_IRQ -> GLUE: registered ~in_vsync, identical to VGA_VSYNC
  #   today (negative, 2 lines at v = 490..491); polarity fixed for every
  #   future raster mode independent of the connector's VSYNC polarity.
  #   GLUE edge-latches it (VSYNC_STATUS).
  # - PADDLE_TICK -> PORTS and AUDIO_TICK -> a test pad (no consumer; the
  #   AUDIO chip divides the pixel clock itself): square waves toggling on the clock that starts every
  #   line (period 1600 clocks, free-running from reset, no frame-boundary
  #   exception).  Consumers act on FALLING edges only: 15.734 kHz events
  #   (PADDLE_TICKS_PER_SECOND, AUDIO_SAMPLES_PER_SECOND).  Separate nets
  #   so the audio rate can change alone.
  # - VGA_HSYNC and VGA_VSYNC drive ONLY the 74AC541 buffers.
  # - DUART OP4..OP7 land on four reserved PIXEL pins with no logic behind
  #   them yet; a future raster/audio-rate select would take them.  1111, the
  #   OPR reset state (see DUART), selects this video_timing.
  #
  # The decoder is INDEX-ONLY.  Every playfield pixel in every mode is a
  # four-bit palette index on IDX[3:0], which addresses the external 16x12
  # palette RAM (interfaces, "Palette RAM"); that RAM's outputs are
  # COMPOSITOR's RGB_IN.  PIXEL holds no colour register of any kind.
  # - PIXELS FIFO read port: 2x IDT7200 read as ONE ganged 16-bit port.
  #   PIXELS_Q[15:0] in, ONE registered nPIXELS_RE out, low for exactly one
  #   clock per word and never low on two consecutive clocks; at least 8 pixel
  #   clocks between reads in every defined mode.  Words are consumed MSB
  #   first from bit 15, so a record renders the same as it did on the retired
  #   byte-interleaved port.  /RS of the pair is PIXEL's own nRS.
  # - No empty-flag input and no half-full pacing: underrun repeats the last
  #   word (ENGINE must keep the stream ahead; see vidcmd-spec.md).
  # - SET registers, applied directly at COMPOSITOR's set_pix_commit from the
  #   set_pix_value bus (targets VIDCMD_SET_PIX_*): CLUT_INDEX, CLUT_DATA,
  #   BASE, MODE, PIXEL_SKIP.  PIXEL taps only set_pix_value[3:0]; all twelve
  #   bits go to the palette RAM's data inputs.
  # - MODE: mode[1:0] is a depth ENUMERATION (VIDCMD_PIX_MODE_1BPP / _2BPP /
  #   _4BPP / _ATTR), mode[2] is half rate (every group held two pixel clocks,
  #   320 groups per line), mode[3] is RESERVED and must be written 0.  Index
  #   formation: 1bpp {BASE[3:1], bit}, 2bpp {BASE[3:2], dibit}, 4bpp the
  #   nibble (BASE unused), attribute bit ? fg : bg out of a
  #   {fg[3:0], bg[3:0], pattern[7:0]} word per eight-group cell, pattern MSB
  #   first.  Words per line are the PIXELS_WORDS_PER_LINE_* constants; 4bpp
  #   at full rate is UNDEFINED and must not be emitted.  A mid-line mode
  #   change is undefined.
  # - PIXEL_SKIP is a start position in STREAM BITS inside the line's first
  #   word (no whole-word discard; coarser scrolling moves the descriptor's
  #   source pointer).  It is sampled at that line's preload and clamped at
  #   consumption: 2bpp ignores bit 0, 4bpp bits [1:0], attribute forces 0,
  #   and the value is capped at PIXELS_SKIP_MAX_*.  A line whose skip is
  #   non-zero consumes PIXELS_SKIP_EXTRA_WORDS more words than its mode's
  #   record and its tail shows real stream data; the list author supplies
  #   that word.
  # - PALETTE WRITE: a SET CLUT_DATA muxes CLUT_INDEX onto IDX for three
  #   clocks and pulses nCLUT_WE low for the middle one, so the RAM gets a
  #   full clock of address and data setup and a full clock of hold.  The data
  #   is COMPOSITOR's set_pix_value bus, which is re-registered from every
  #   staged word, so the CLUT_DATA SET must be followed by a SAME-VALUE SET
  #   to target 7 (the filler) or the RAM stores the next word's payload
  #   instead: one entry costs VIDCMD_WORDS_PER_CLUT_ENTRY words.  IDX is
  #   stolen for the three pixel clocks after the commit and one more is a
  #   write-recovery guard, so those four pixel slots must be in blanking or
  #   covered by a non-passthrough source (a cmp_color RUN or STREAM RUN, a
  #   LITERAL/HOLD span, or an opaque MASK dibit).
  # - Reset (nRS at vsync): MODE, BASE, PIXEL_SKIP, CLUT_INDEX all 0, IDX 0,
  #   nCLUT_WE and nPIXELS_RE high — so an untouched chip is 1bpp full rate
  #   out of palette entries 0 and 1.  THE PALETTE RAM IS NEVER RESET: it
  #   powers up undefined, software loads what it uses, and its contents
  #   persist across frames.
  # - `make pixel-sim` (pixel_tb.v) is the executable per-mode semantics,
  #   `make timing-sim` the raster laws and `make clut-pair-sim` the
  #   palette-write window.
  PIXEL:
    part: "ATF1508AS (PLCC84)"
    description: "Raster time base and indexed PIXELS unpacker: 4-bit palette index + palette-RAM write port, VGA syncs, frame /RS, COMPOSITOR H_ACTIVE, ENGINE HBLANK, GLUE vsync IRQ, PORTS ticks"
    clock: 25175000    # dedicated pixel oscillator, not SYSCLK; shared with COMPOSITOR
    # VESA 640x480@60.  Horizontal counts in pixel clocks, vertical in
    # lines; codegen checks that the four terms sum to the total.
    # timing.v's H_*/V_* localparams must equal these values; the generated
    # PIXEL_H_*/PIXEL_V_* defines are the checkable form.
    video_timing:
      pixel_clock_hz: 25175000
      h_active:       640
      h_front_porch:  16
      h_sync:         96
      h_back_porch:   48
      h_total:        800
      v_active:       480
      v_front_porch:  10
      v_sync:         2
      v_back_porch:   33
      v_total:        525
      hsync_polarity: negative
      vsync_polarity: negative

  # COMPOSITOR (cpld/compositor/compositor.v) sits between PIXEL and the DAC.
  # It plays the per-line VIDCMD instruction stream out of the VIDCMD FIFO
  # (2x IDT7200 ganged 16-bit, filled by ENGINE) and for every active pixel
  # slot selects one of passthrough (RGB_IN from PIXEL), cmp_color1,
  # cmp_color0, or KEEP (RGB_OUT holds the last colour shown).  Records: RUN,
  # STREAM RUN, HOLD, LITERAL, SET (targets VIDCMD_SET_*: 0..1 local, 2..6
  # forwarded to PIXEL), MASK (two-word 16-pixel overlay).  Bit-level encodings are in
  # super-engine/descriptor.h and semantics in vidcmd-spec.md.  Everything is
  # in the PIXEL_CLK domain except nVIDCMD_EF (2-FF synchronized); H_ACTIVE,
  # nRS and RGB_IN arrive on the same clock unsynchronized.  Machine reset is
  # PIXEL's nRS (GCLR), once per frame.  RGB_OUT[11:0] -> the 74AC541
  # buffers and DAC (see interfaces).
  # - VIDCMD FIFO read port (2x IDT7200L15, shared /RE): registered /RE
  #   from COMPOSITOR, 2 pixel clocks per word, no shaping gate (timing
  #   margins: griffin.log 2026-09-03).  Consequence: VIDCMD cadence is
  #   uniformly 2 slots per word (1-px spans render 2 px wide);
  #   compositor_tb, vidcmd-spec.md and the super-engine model encode it.
  # - VIDCMD FIFO /EF -> COMPOSITOR input, synchronized on-chip with an
  #   asymmetric guard (2-FF sync governs the asynchronous rise from
  #   ENGINE-domain writes; the raw flag governs the fall caused by
  #   COMPOSITOR's own clock-aligned read).
  # - COMPOSITOR -> PIXEL SET path: a dedicated 12-bit registered value bus
  #   set_pix_value[11:0] alongside the valid/target/commit handshake; the
  #   bus is registered from COMPOSITOR's staged word — from EVERY staged
  #   word, whatever its target, which is why a palette entry needs a filler
  #   (see PIXEL) — and PIXEL applies it at the commit pulse with no capture
  #   register.  PIXEL taps [3:0] only; all twelve bits also drive the
  #   palette RAM's data inputs (see interfaces, "Palette RAM").
  # - COMPOSITOR's own colours (cmp_color1, cmp_color0, LITERAL, MASK) are
  #   direct 12-bit values and never go through the palette.
  COMPOSITOR:
    part: "ATF1508AS (PLCC84)"
    description: "VIDCMD stream player: per-slot source select over the palette RAM's R4G4B4, literal pixels, SET forwarding to PIXEL, MASK overlays"
    clock: 25175000

  # GLUE decodes the region, hands over ~PORTS_SELECT and answers DTACK.
  # Time base is PIXEL's PADDLE_TICK; PORTS counts falling edges only and has no
  # divider, so a rate change is a PIXEL change.
  # The mouse channel mirrors GLUE's keyboard register layout and offsets.
  PORTS:
    part: ATF1508AS
    description: "PS/2 mouse, two joystick ports and two paddle counters"
    address_range:
      base: 0xFC0000
      size: 0x040000
      width: 8
    dtack:
      - 12000000: 0
      - 14000000: 0
      - 14318181: 0
      - 16000000: 0
      - 20000000: 0
    interrupt:
      level: 2
      signal: ~PORTS_IRQ    # mouse RX_READY/TX_DONE only; audio raises no interrupt
    registers:
      - offset: 0x01
        name: JOYSTICK_PORT_1
        access: read
        width: 8
        description: |
          Joystick port 1 switches, active low (0 = closed).
          This port also hosts the paddles: PIN9/PIN5 double as SMS button 2
          and the raw pot comparator levels; paddle fire buttons appear on
          LEFT/RIGHT (2600 convention).  No interrupt; poll from the vsync
          ISR.  Bit 7 reads 1.
        bits:
          - { bit: "0", name: UP,    description: "Port 1 up, DE-9 pin 1" }
          - { bit: "1", name: DOWN,  description: "Port 1 down, DE-9 pin 2" }
          - { bit: "2", name: LEFT,  description: "Port 1 left, DE-9 pin 3 (also paddle B fire)" }
          - { bit: "3", name: RIGHT, description: "Port 1 right, DE-9 pin 4 (also paddle A fire)" }
          - { bit: "4", name: FIRE,  description: "Port 1 fire, DE-9 pin 6" }
          - { bit: "5", name: PIN9,  description: "Port 1 DE-9 pin 9: SMS button 2 / paddle A pot level" }
          - { bit: "6", name: PIN5,  description: "Port 1 DE-9 pin 5: paddle B pot level" }
      - offset: 0x03
        name: JOYSTICK_PORT_2
        access: read
        width: 8
        description: |
          Joystick port 2 switches, active low (0 = closed).
          Same bit order as JOYSTICK_PORT_1; no paddles.  Bit 7 reads 1.
        bits:
          - { bit: "0", name: UP,    description: "Port 2 up, DE-9 pin 1 (0 = pressed)" }
          - { bit: "1", name: DOWN,  description: "Port 2 down, DE-9 pin 2" }
          - { bit: "2", name: LEFT,  description: "Port 2 left, DE-9 pin 3" }
          - { bit: "3", name: RIGHT, description: "Port 2 right, DE-9 pin 4" }
          - { bit: "4", name: FIRE,  description: "Port 2 fire, DE-9 pin 6" }
          - { bit: "5", name: PIN9,  description: "Port 2 DE-9 pin 9: SMS button 2" }
          - { bit: "6", name: PIN5,  description: "Port 2 DE-9 pin 5 (spare input)" }
      - offset: 0x05
        name: PADDLE_A_COUNT
        access: read
        width: 8
        description: |
          Paddle A position, the pot on port 1 pin 9.
          Counts PADDLE_TICK events while the pot's RC ramp holds the
          comparator low, freezes when it crosses, saturates at 0xFF (about
          one frame).  Board RC must cross full travel in < ~250 ticks.
          Needs per-unit software calibration.
        bits:
          - { bit: "7:0", name: COUNT, description: "PADDLE_TICK count, saturating at 0xFF" }
      - offset: 0x07
        name: PADDLE_B_COUNT
        access: read
        width: 8
        description: |
          Paddle B position, the pot on port 1 pin 5.
          Behaves as PADDLE_A_COUNT; cleared by the same PADDLE_CONTROL.DUMP.
        bits:
          - { bit: "7:0", name: COUNT, description: "PADDLE_TICK count, saturating at 0xFF" }
      - offset: 0x09
        name: PS2_MOUSE_TX_DATA
        access: write
        width: 8
        description: |
          Byte to transmit host->mouse; the write itself starts the frame.
          Same protocol as GLUE PS2_TX_DATA, including parity in address
          bit 1 (write +PS2_TX_DATA_PARITY for parity 1) and TX_DONE
          raising the IRQ.  Ignored while a TX or RX frame is in progress.
        bits:
          - { bit: "7:0", name: DATA, description: "Data byte to send (write triggers TX)" }
      - offset: 0x0F
        name: PADDLE_CONTROL
        access: write
        width: 8
        description: |
          Paddle measurement control, written once per vsync ISR.
          DUMP set drives the discharge-FET line and holds both counters at
          zero; clearing it releases the caps and starts the next measurement.
        bits:
          - { bit: "0", name: DUMP, default: 0,
              description: "1 = drain the paddle caps and hold both counters at zero; 0 = measure" }
      - offset: 0x11
        name: PS2_MOUSE_STATUS
        access: read
        width: 8
        description: |
          PS/2 mouse frame-engine status.
          Same semantics and bit layout as GLUE PS2_STATUS; W1C via
          PS2_MOUSE_CLEAR.
        bits:
          - { bit: "0", name: RX_READY,
              description: "1 = a received byte is in PS2_MOUSE_RX_DATA; asserts the IRQ" }
          - { bit: "1", name: TX_DONE,
              description: "1 = host->device frame finished; asserts the IRQ" }
          - { bit: "2", name: TX_ACK,
              description: "Device ACK sampled on the final clock of the last TX (0 = acknowledged)" }
          - { bit: "3", name: RX_PARITY,
              description: "Received parity bit of the latched byte (not checked in hardware)" }
          - { bit: "4", name: RX_FRAME_ERR,
              description: "1 = framing error" }
          - { bit: "5", name: DATA_LIVE,
              description: "Unlatched synchronized PS2_MOUSE_DATA pin state (debug)" }
          - { bit: "6", name: CLK_LIVE,
              description: "Debounced PS2_MOUSE_CLK level the frame engine clocks on, not the raw pin (debug)" }
      - offset: 0x11
        name: PS2_MOUSE_CLEAR
        access: write
        width: 8
        description: |
          Write-1-to-clear for PS2_MOUSE_STATUS latched flags / IRQ ack.
          The IRQ de-asserts once RX_READY and TX_DONE are clear.
        bits:
          - { bit: "0", name: RX_READY, description: "Write 1 to clear RX_READY (RX byte ISR ack)" }
          - { bit: "1", name: TX_DONE,  description: "Write 1 to clear TX_DONE (TX completion ISR ack)" }
      - offset: 0x13
        name: PS2_MOUSE_CTRL
        access: write
        width: 8
        description: |
          Open-drain drive control for PS2_MOUSE_CLK and PS2_MOUSE_DATA for the TX inhibit handshake.
          Same semantics as GLUE PS2_CTRL.
        bits:
          - { bit: "0", name: CLK,
              description: "1 = drive PS2_MOUSE_CLK low (inhibit / request-to-send)" }
          - { bit: "1", name: DATA,
              description: "1 = drive PS2_MOUSE_DATA low" }
      - offset: 0x15
        name: PS2_MOUSE_RX_DATA
        access: read
        width: 8
        description: "Assembled PS/2 mouse data byte; valid while RX_READY is set."
        bits:
          - { bit: "7:0", name: DATA, description: "Received packet byte" }

  # 16-bit True IDE PIO.  GLUE gates IOWR with AS.  Sideband pins INTRQ and
  # IORDY go to GLUE (see GLUE CF_PINS).  The dtack entries below are the
  # fixed part of the cycle; IORDY extends it.
  CF:
    part: "Compact Flash (True IDE)"
    description: "Storage via CF card in True IDE 16-bit PIO mode"
    interrupt:
      level: 1
      signal: CF_INTRQ    # gated in GLUE by CONFIG.CF_IRQ_EN
    address_range:
      base: 0xF40000
      size: 0x040000
      width: [8, 16]
    dtack:
      - 12000000: 7
      - 14000000: 7
      - 14318181: 7
      - 16000000: 8
      - 20000000: 12
    registers:
      - { offset: 0x00, name: DATA,         access: rw,    width: 16,
          description: "16-bit data port to/from the CF card" }
      - { offset: 0x03, name: ERROR,        access: read,  width: 8,
          description: "Error register" }
      - { offset: 0x03, name: FEATURES,     access: write, width: 8,
          description: "Features register" }
      - { offset: 0x05, name: SECTOR_COUNT, access: rw,    width: 8,
          description: "Number of sectors to transfer" }
      - { offset: 0x07, name: SECTOR_NUM,   access: rw,    width: 8,
          description: "LBA bits 7:0" }
      - { offset: 0x09, name: CYL_LO,       access: rw,    width: 8,
          description: "LBA bits 15:8" }
      - { offset: 0x0B, name: CYL_HI,       access: rw,    width: 8,
          description: "LBA bits 23:16" }
      - { offset: 0x0D, name: DRIVE_HEAD,   access: rw,    width: 8,
          description: "LBA bits 27:24 and drive select; OR with CF_DH_LBA for LBA mode" }
      - { offset: 0x0F, name: STATUS,       access: read,  width: 8,
          description: "Status register" }
      - { offset: 0x0F, name: COMMAND,      access: write, width: 8,
          description: "Command register" }

  DUART:
    part: "XR68C681"
    description: "Console (Ch A) and second serial (Ch B), 100 Hz systick C/T, GP pins for flow control / MCP7940N RTC I2C"
    clock: 3686400
    # OP/IP pin wiring.  OP pins drive the COMPLEMENT of their OPR bits
    # (OPR_SET drives the pin LOW); levels below are PIN levels.
    #   OP0: ~RTS_A                              IP0: ~CTS_A
    #   OP1: ~RTS_B                              IP1: ~CTS_B
    #   OP2: RTC_SCL (MCP7940N I2C clock, push-pull)
    #   OP3: RTC_SDA_DRIVE (N-FET gate: pin high pulls SDA low)
    #                                            IP2: RTC_SDA readback
    #                                            IP3: RTC_MFP (MCP7940N MFP, firmware programs it as the 1 Hz square wave)
    #   OP4..OP7: PIXEL reserved pins (no logic) IP4: DCD_B (ch B carrier)
    #                                            IP5: RI_B (ch B ring)
    # IP4/IP5 come from the ch B RS-232 receivers; the 68681
    # change-of-state IRQ covers only IP0-IP3, so both are poll-only.
    # RTC seconds: firmware counts MFP rising edges in the IP3 change-of-state
    # IRQ (ACR.IP3_INT_EN, ISR.IPC, IPCR read to clear) and reads the
    # MCP7940N over I2C only at boot and on a set, so wall time never costs an
    # I2C transaction after boot.  The MCP7940N is the only I2C device; it
    # does not clock-stretch, so SCL is push-pull.  At reset OPR = 0 holds
    # SDA LOW through the FET until firmware sets OPR bit 3.
    # OP4..OP7 reach PIXEL's reserved pins but nothing decodes them.  The
    # 68681 RESET pin clears OPR, so OP4..OP7 come up HIGH (1111) with no
    # firmware action, and firmware never sets OPR bits 4..7.  1111 selects
    # today's raster (PIXEL video_timing) and keeps doing so when PIXEL
    # decodes the four pins.
    # Bus: ~CS from GLUE (nDUART_SELECT), DTACKN back to GLUE (nDUART_DTACK),
    # ~IACK tied high, RESET (active low) directly on the system ~RESET net.
    address_range:
      base: 0xF80000
      size: 0x040000
      width: 8
    interrupt:
      level: 5
      signal: ~DUART_IRQ
    dtack: ~DUART_DTACK  # handshake: 68681 DTACKN
    registers:
      - { offset: 0x01, name: MR1A,   access: rw,    width: 8,
          description: "Channel A mode register 1" }
      - { offset: 0x01, name: MR2A,   access: rw,    width: 8,
          description: "Channel A mode register 2" }
      - offset: 0x03
        name: SRA
        access: read
        width: 8
        description: "Channel A status register"
        bits:
          - { bit: "0", name: RXRDY, description: "Receiver ready" }
          - { bit: "1", name: FFULL, description: "FIFO full" }
          - { bit: "2", name: TXRDY, description: "Transmitter ready" }
          - { bit: "3", name: TXEMT, description: "Transmitter empty" }
          - { bit: "4", name: OE,    description: "Overrun error" }
          - { bit: "5", name: PE,    description: "Parity error" }
          - { bit: "6", name: FE,    description: "Framing error" }
          - { bit: "7", name: RB,    description: "Received break" }
      - { offset: 0x03, name: CSRA,   access: write, width: 8,
          description: "Channel A clock select register" }
      - offset: 0x05
        name: CRA
        access: write
        width: 8
        description: "Channel A command register"
        bits:
          - { bit: "1:0", name: EC,  description: "Enable command: 0=no action, 1=enable RX, 2=disable RX" }
          - { bit: "3:2", name: TC,  description: "Transmitter command: 0=no action, 1=enable TX, 2=disable TX" }
          - { bit: "6:4", name: MC,  description: "Misc command: 1=reset MR ptr, 2=reset RX, 3=reset TX, 4=reset error, 5=reset break, 6=start break, 7=stop break" }
      - { offset: 0x07, name: RBA,    access: read,  width: 8,
          description: "Channel A receiver buffer" }
      - { offset: 0x07, name: TBA,    access: write, width: 8,
          description: "Channel A transmitter buffer" }
      - offset: 0x09
        name: IPCR
        access: read
        width: 8
        description: "Input port change register (reading it clears the delta bits)."
        bits:
          - { bit: "7", name: DELTA_IP3, description: "IP3 changed since the last read" }
          - { bit: "6", name: DELTA_IP2, description: "IP2 changed since the last read" }
          - { bit: "5", name: DELTA_IP1, description: "IP1 changed since the last read" }
          - { bit: "4", name: DELTA_IP0, description: "IP0 changed since the last read" }
          - { bit: "3", name: IP3, description: "Current IP3 level" }
          - { bit: "2", name: IP2, description: "Current IP2 level" }
          - { bit: "1", name: IP1, description: "Current IP1 level" }
          - { bit: "0", name: IP0, description: "Current IP0 level" }
      - offset: 0x09
        name: ACR
        access: write
        width: 8
        description: "Auxiliary control register (timer/counter mode, BRG set select)"
        bits:
          - { bit: "7",   name: BRG_SET,     description: "0 = BRG set 0; 1 = BRG set 1 (selects CSRA/CSRB rate table)" }
          - { bit: "6:4", name: CT_MODE,     description: "C/T mode + clock: 6=Timer X1/CLK, 7=Timer X1/CLK÷16, 3=Counter X1/CLK÷16" }
          - { bit: "3",   name: IP3_INT_EN,  description: "IP3 change-of-state IRQ enable" }
          - { bit: "2",   name: IP2_INT_EN,  description: "IP2 change-of-state IRQ enable" }
          - { bit: "1",   name: IP1_INT_EN,  description: "IP1 change-of-state IRQ enable" }
          - { bit: "0",   name: IP0_INT_EN,  description: "IP0 change-of-state IRQ enable" }
      - offset: 0x0B
        name: ISR
        access: read
        width: 8
        description: "Interrupt status register"
        bits:
          - { bit: "0", name: TXRDYA,      description: "Channel A TX ready" }
          - { bit: "1", name: RXRDYA,      description: "Channel A RX ready/FIFO full" }
          - { bit: "2", name: DELTA_BRKA,  description: "Channel A break change" }
          - { bit: "3", name: CTR_READY,   description: "Counter/timer ready" }
          - { bit: "4", name: TXRDYB,      description: "Channel B TX ready" }
          - { bit: "5", name: RXRDYB,      description: "Channel B RX ready/FIFO full" }
          - { bit: "6", name: DELTA_BRKB,  description: "Channel B break change" }
          - { bit: "7", name: IPC,         description: "Input port change" }
      - { offset: 0x0B, name: IMR,    access: write, width: 8,
          description: "Interrupt mask register (same bit layout as ISR; 1=enabled)" }
      - { offset: 0x0D, name: CUR,    access: read,  width: 8,
          description: "Counter/timer upper byte (current value)" }
      - { offset: 0x0D, name: CTUR,   access: write, width: 8,
          description: "Counter/timer upper preload register" }
      - { offset: 0x0F, name: CLR,    access: read,  width: 8,
          description: "Counter/timer lower byte (current value)" }
      - { offset: 0x0F, name: CTLR,   access: write, width: 8,
          description: "Counter/timer lower preload register" }
      - { offset: 0x11, name: MR1B,   access: rw,    width: 8,
          description: "Channel B mode register 1" }
      - { offset: 0x11, name: MR2B,   access: rw,    width: 8,
          description: "Channel B mode register 2" }
      - { offset: 0x13, name: SRB,    access: read,  width: 8,
          description: "Channel B status register (same bit layout as SRA)" }
      - { offset: 0x13, name: CSRB,   access: write, width: 8,
          description: "Channel B clock select register" }
      - { offset: 0x15, name: CRB,    access: write, width: 8,
          description: "Channel B command register (same bit layout as CRA)" }
      - { offset: 0x17, name: RBB,    access: read,  width: 8,
          description: "Channel B receiver buffer" }
      - { offset: 0x17, name: TBB,    access: write, width: 8,
          description: "Channel B transmitter buffer" }
      - { offset: 0x19, name: IVR,    access: rw,    width: 8,
          description: "Interrupt vector register" }
      - { offset: 0x1B, name: IP,     access: read,  width: 8,
          description: "Input port (unlatched)" }
      - { offset: 0x1B, name: OPCR,   access: write, width: 8,
          description: "Output port configuration register" }
      - { offset: 0x1D, name: STARTCC, access: read, width: 8,
          description: "Start counter/timer command (read)" }
      - { offset: 0x1D, name: OPR_SET, access: write, width: 8,
          description: "Output port bit set (sets OPR bits; those OP pins go LOW)" }
      - { offset: 0x1F, name: STOPCC,  access: read, width: 8,
          description: "Stop counter/timer command (read)" }
      - { offset: 0x1F, name: OPR_CLR, access: write, width: 8,
          description: "Output port bit reset (clears OPR bits; those OP pins go HIGH)" }

  # AUDIO (rev 2) is a four-channel DMA sample player.
  # The 68000 reaches it through ENGINE descriptors whose destination is one of
  # the five 7200s (ENGINE_DEST_SAMPLES0..3_FIFO_W for the
  # channels, ENGINE_DEST_AUDCTL_FIFO_W for control): each deposited word
  # carries one byte, and which byte is fixed by the FIFO's data pins:
  # channels 0 and 1 (left) take D[15:8], channels 2 and 3 (right) and
  # the control FIFO take D[7:0]; the other byte is discarded.  So an
  # interleaved stereo buffer (L,R byte pairs, as an 8-bit WAV data chunk
  # lies in memory) streams to a left and a right channel as two
  # descriptors over the same words, and a mono table is authored with
  # the sample in both bytes so it can go to any channel.  Channel n's
  # FIFO Q bus drives its own R-2R ladder directly; the AUDIO CPLD
  # holds /R low and pulses it to advance at the channel's rate,
  # AUDIO_STEP_HZ / (PERIOD + 1) with AUDIO_STEP_HZ = the pixel clock /
  # AUDIO_STEP_CLOCKS, the divider's phase pulled onto the raster by PIXEL's
  # HBLANK once per line; PERIOD AUDIO_PERIOD_TICK is the 15,734.375 Hz tick.  Pitch is rate over table
  # length; the 68000 chooses both.  VOLUME (6 bits) is a duty cycle,
  # VOLUME/64 of every 512-clock frame, applied by a 74HC4066 switch
  # between the ladder and its side's summing node (channels 0,1 left,
  # 2,3 right); the gate is off while the FIFO is empty and during the
  # advance clock.  Control records are two bytes, {register, value}:
  # AUDIO_REG_PERIOD + n and AUDIO_REG_VOLUME + n.  Samples are offset
  # binary (AUDIO_SILENCE = 0x80, as 8-bit WAV).  Set PERIOD before depositing: at
  # reset PERIOD is 0 and a channel advances every step.  A write to a full
  # FIFO is dropped, a pop of an empty one is silent; the display-list
  # author schedules deposits against the rates (audio/scheduler.h is the
  # reference policy; the chip's laws are audio/audio_chip.h).
  AUDIO:
    part: "ATF1508AS + 5x IDT7200 (byte wide) + 4x 4610X-R2R-103LF + 74HC4066 + LM358 summers + 3x LM386"
    description: "Four DMA-fed sample channels with period counters and duty-cycle volume, driven only by ENGINE deposits"

constants:
  CF_STATUS_BSY:   0x80
  CF_STATUS_DRDY:  0x40
  CF_STATUS_DRQ:   0x08
  CF_STATUS_ERR:   0x01
  CF_CMD_READ_SECTORS:  0x20
  CF_CMD_WRITE_SECTORS: 0x30
  CF_CMD_IDENTIFY:      0xEC
  CF_CMD_SET_FEATURES:  0xEF
  CF_DH_LBA:            0xE0
  PS2_RX_QUEUE_SIZE:    64

  # AUDIO: five byte-wide 7200s (256 x 9), the tick, and the chip's laws
  # (audio/audio_chip.h).  Sample rate of a channel = pixel clock /
  # AUDIO_STEP_CLOCKS / (PERIOD + 1).
  AUDIO_FIFO_DEPTH:          256
  AUDIO_SAMPLES_PER_SECOND:  15734   # PIXEL AUDIO_TICK falling edges: every second 31.469 kHz line; PERIOD 99
  PADDLE_TICKS_PER_SECOND:   15734   # PIXEL PADDLE_TICK falling edges: same
  AUDIO_CHANNELS:            4
  AUDIO_STEP_CLOCKS:         16      # period counters step every 16 pixel clocks (1,573,437.5 Hz)
  AUDIO_PERIOD_TICK:         99      # PERIOD for exactly AUDIO_SAMPLES_PER_SECOND
  AUDIO_PERIOD_MAX:          255
  AUDIO_VOLUME_MAX:          63      # of 64; the frame is 512 pixel clocks
  AUDIO_SILENCE:             0x80    # offset binary, the ladder's own code
  AUDIO_REG_PERIOD:          0       # control record register = AUDIO_REG_PERIOD + channel
  AUDIO_REG_VOLUME:          4       # or AUDIO_REG_VOLUME + channel (low 6 bits)

  # DUART OP/IP masks (see the DUART pin wiring).  OP pins drive the
  # COMPLEMENT of their OPR bits; RTC_SDA_DRIVE inverts again through the
  # N-FET (pin high = SDA low).  OP4..OP7 have no masks until PIXEL uses them.
  DUART_OP_RTC_SCL:        0x04   # OP2
  DUART_OP_RTC_SDA_DRIVE:  0x08   # OP3
  DUART_IP_RTC_SDA:        0x04   # IP2
  DUART_IP_RTC_MFP:        0x08   # IP3: MCP7940N MFP (alarm or square wave; polarity per its ALMPOL bit)
  DUART_IP_DCD_B:          0x10   # IP4: ch B carrier detect (poll-only)
  DUART_IP_RI_B:           0x20   # IP5: ch B ring indicate (poll-only)
  RTC_I2C_ADDR:            0x6F   # MCP7940N 7-bit I2C address

  # PS/2 TX parity is carried in address bit 1 of the TX_DATA registers.
  PS2_TX_DATA_PARITY:   0x02

  # ENGINE bus-arbitration burst: words per bus-grant cycle (sizing
  # rationale: griffin.log 2026-09-03).
  ENGINE_WORDS_PER_BURST: 20

  # Frame interrupt level (PIXEL nVSYNC_IRQ latched in GLUE).
  VSYNC_IRQ_LEVEL: 6

  # --- Video path: numbers more than one component must agree on.  Bit-level
  # VIDCMD/descriptor encodings stay in super-engine/descriptor.h; semantics
  # in vidcmd-spec.md; implementations in cpld/{engine,compositor,pixel}.

  # ENGINE descriptor word0 bits 2:0: the destination code, decoded on chip
  # to the deposit strobe pin of the same name; 0 strobes nothing.
  ENGINE_DEST_NONE:             0
  ENGINE_DEST_PIXELS_FIFO_W:    1
  ENGINE_DEST_VIDCMD_FIFO_W:    2
  ENGINE_DEST_AUDCTL_FIFO_W:    3
  ENGINE_DEST_SAMPLES0_FIFO_W:  4
  ENGINE_DEST_SAMPLES1_FIFO_W:  5
  ENGINE_DEST_SAMPLES2_FIFO_W:  6
  ENGINE_DEST_SAMPLES3_FIFO_W:  7

  # VIDCMD SET target numbering {1, ttt, value[11:0]}: 0..1 COMPOSITOR-local,
  # 2..6 forwarded to PIXEL over the valid/target/commit handshake.  Target 0
  # writes cmp_color1 and target 1 writes cmp_color0 (see issues).  Target 7 is
  # ignored by both chips, which is what makes it the palette-write FILLER: a
  # same-value SET to it holds set_pix_value across the write pulse (see PIXEL).
  VIDCMD_SET_CMP_COLOR1:     0
  VIDCMD_SET_CMP_COLOR0:     1
  VIDCMD_SET_PIX_CLUT_INDEX: 2
  VIDCMD_SET_PIX_CLUT_DATA:  3
  VIDCMD_SET_PIX_BASE:       4
  VIDCMD_SET_PIX_MODE:       5
  VIDCMD_SET_PIX_PIXEL_SKIP: 6
  VIDCMD_SET_FILLER:         7

  # A palette entry is three VIDCMD words: SET CLUT_INDEX, SET CLUT_DATA and
  # the same-value filler.
  VIDCMD_WORDS_PER_CLUT_ENTRY: 3

  # RUN, STREAM RUN and HOLD counts are ten bits (bits 11:10 are the record
  # kind); a count of 0 plays 1024 slots.
  VIDCMD_RUN_COUNT_MAX: 1023

  # SET PIX_MODE value: mode[1:0] depth enumeration, mode[2] half rate,
  # mode[3] reserved (write 0).
  VIDCMD_PIX_MODE_1BPP:      0
  VIDCMD_PIX_MODE_2BPP:      1
  VIDCMD_PIX_MODE_4BPP:      2
  VIDCMD_PIX_MODE_ATTR:      3
  VIDCMD_PIX_MODE_HALF_RATE: 0x4

  # Stream FIFO depth in words (parts: interfaces, Stream FIFO parts).
  PIXELS_FIFO_WORDS: 256
  VIDCMD_FIFO_WORDS: 256

  # Pixel stream lengths, in 16-bit words per visible line, one per defined
  # mode (no in-band header).  Half rate halves the stream; 4bpp full rate is
  # undefined and has no constant.  Attribute mode is one word per eight-group
  # cell.
  PIXELS_WORDS_PER_LINE_1BPP:      40
  PIXELS_WORDS_PER_LINE_1BPP_HALF: 20
  PIXELS_WORDS_PER_LINE_2BPP:      80
  PIXELS_WORDS_PER_LINE_2BPP_HALF: 40
  PIXELS_WORDS_PER_LINE_4BPP_HALF: 80
  PIXELS_WORDS_PER_LINE_ATTR:      80
  PIXELS_WORDS_PER_LINE_ATTR_HALF: 40

  # A line whose PIXEL_SKIP is non-zero reads this many words MORE than its
  # mode's record, and never more than this however large the skip.
  PIXELS_SKIP_EXTRA_WORDS: 1

  # PIXEL_SKIP is clamped at consumption to these caps (above the cap the
  # first fetch trigger or the preload's own lead would be missed).
  PIXELS_SKIP_MAX_1BPP:      14   # either rate
  PIXELS_SKIP_MAX_2BPP:      12   # full rate
  PIXELS_SKIP_MAX_2BPP_HALF: 14
  PIXELS_SKIP_MAX_4BPP_HALF: 12

  # Pipeline lead constants -- DERIVED from measured stage latencies, not
  # tuned; the raster generator fires its comparators early by exactly these
  # amounts and timing.v localparams must stay equal to them.
  COMPOSITOR_LEAD:    2    # consume edge + registered RGB_OUT (compositor_tb)
  PIXEL_OUT_LEAD:     1    # consumed group -> registered IDX inside PIXEL
  TIMING_SPLIT_LEAD:  1    # the registered raster-strobe hop inside PIXEL (timing.v SPLIT_LEAD)
  DAC_LEAD:           4    # sum of the above: sync compares shift by this
  PIXEL_PRELOAD_LEAD: 16   # hblank fetch lead (derivation: griffin.log 2026-09-03)

# Firmware<->application syscall ABI: TRAP #15, call number in d0, up to
# three args in d1/d2/d3 (pointers as longs), result in d0; d0 < 0 is -errno.
# d0-d3 are clobbered.  Shared by sys_dispatch (firmware) and
# apps/lib/syscalls.c (app stubs).
syscalls:
  trap: 15
  calls:
    - name: EXIT
      number: 0
      description: "Terminate the application and return control to the firmware."
    - name: WRITE
      number: 1
      description: "write(fd, buf, len) to the console or a file."
    - name: READ
      number: 2
      description: "read(fd, buf, len) from the console or a file."
    - name: OPEN
      number: 3
      description: "open(path, flags, mode); returns a file descriptor."
    - name: CLOSE
      number: 4
      description: "close(fd)."
    - name: LSEEK
      number: 5
      description: "lseek(fd, offset, whence)."
    - name: FSTAT
      number: 6
      description: "fstat(fd, stat buffer)."
    - name: ISATTY
      number: 7
      description: "isatty(fd)."
    - name: STAT
      number: 8
      description: "stat(path, stat buffer)."
    - name: INPUTREADY
      number: 9
      description: "Return 1 if console input is ready so a read from the console would not block."
    - name: READDIR
      number: 10
      description: "readdir(path, index, entry buffer) fills one directory entry and returns 0, or 1 past the end."
    - name: GETTICKS
      number: 11
      description: "Return milliseconds since boot as an unsigned 32-bit count that wraps."
    - name: GETTIME
      number: 12
      description: "Return seconds since the Unix epoch, UTC, from the firmware seconds counter that the RTC MFP interrupt advances, or from the build time plus uptime when no RTC answered at boot."
    # Direct video ownership contract and GriffinVideoDirectInfo: griffin_abi.h.
    - name: VIDEO_DIRECT_START
      number: 13
      description: "Take direct control of the video ENGINE: d1 points to a GriffinVideoDirectInfo the firmware fills with the app descriptor-table region."
    - name: VIDEO_DIRECT_END
      number: 14
      description: "Return the video ENGINE to the firmware console."
    # GriffinMouseReport: griffin_abi.h.
    - name: MOUSE_READ
      number: 15
      description: "Decode pending PS/2 mouse packets and fill the GriffinMouseReport that d1 points to."
    - name: VIDEO_VSYNC_IRQ
      number: 16
      description: "While direct video is held, d1 nonzero enables the level-6 vsync IRQ for a handler the app installed and zero masks it again."
    - name: CONSOLE_RAW
      number: 17
      description: "d1 nonzero makes console reads return raw PS/2 scancodes until zero restores line editing, which the loader also restores when the application exits."
    - name: SETTIME
      number: 18
      description: "d1 is seconds since the Unix epoch, UTC; sets the firmware seconds counter and writes the RTC, returning 0, or -ENODEV when no RTC answered at boot and only the counter was set."

# Rev 1 board reworks (applied to board/board-pcb-rev-1.distilled.txt).
bodges:
  - "Reroute A6 pad on U12 to A18"
  - "Route freed GLUE pin 75 to CPU ~VPA"
  - "Pull up CPU HALT with 4.7K to nearby CPU +5V"

# Open items only.
issues:
  - "The DUART OP4..OP7 raster selector into PIXEL has four pins reserved in pixel.v's header but no logic, no alternate video_timing entry and no consumer contract (1111 = today's raster is stated in the DUART entry)."
  - "The boot CPU probe and the two-layout bus-error dump (crt0.s) have run only in the emulator (Moira as a 68010); on the rev-2 board (rev 1 is dead) force a BERR from the monitor (read C00000) and decode the frame with decode_buserr.py, and run the same on a 68000 once one is in the socket."
  - "FIFO desync observability: the display-list ENGINE does not drive the 7200 9th-bit toggle, so there is no FIFO-level desync detector in rev 2.  GLUE ENGINE_STATUS exposes the engine's own state; decide whether that plus frame-bounded /RS recovery is enough."
  - "The palette RAM part is not chosen: 74F219-pinout 16x4 separate-I/O parts differ in address access time and three of them draw the best part of an amp, and the read-path arithmetic (PIXEL tCO + tAA + COMPOSITOR tSU inside one 39.72 ns pixel clock) and the write-path setup/hold/recovery arithmetic are both unsettled."
  - "CLUT_INDEX does not post-increment, so consecutive palette entries cost 3 words each instead of 2."
  - "VIDCMD SET target 0 writes cmp_color1 and target 1 writes cmp_color0.  Swapping the target NUMBERS to match the colour numbers is a wire-contract change, not yet decided."
  - "The PIXELS and VIDCMD stream FIFOs (ENGINE -> PIXEL / COMPOSITOR) are described in comments and constants, not as first-class entries."
  - "IO data buffers, bring-up check: write-data hold at the DUART, PORTS, CF and GLUE after their strobe negates rests on the D_IO branch holding its level after ~IO_BUFFER_OE disables the pair (ATF1508 minimums unpublished), not on a table; scope a DUART write on the rev-2 board."
  - "The headphone jack part is not chosen: the speaker mute needs normally-closed TIP and RING contacts, but the SJ3-35063B in board.pretty has a tip switch only (SJ3-35063BG adds an isolated normally-open switch, not a ring contact).  The schematic draws the contract with a generic tip+ring-switch jack and no footprint."
  - "The AUDIO analog stage (ladders straight off the 7200 Q pins, 74HC4066 duty-cycle gates into a 2.5 V-biased inverting summer) has not been breadboarded; switch on-resistance and switching time at low volumes are the open risk."
  - "BERR in 0x400000-0x7FFFFF, 0xC00000-0xCFFFFF and 0xE00000-0xEFFFFF is by DTACK timeout (no decode; GLUE berr_timeout_clocks); state whether that is the intended contract."
  - "BERR in unassigned IO spaces is unspecified."
  - "Writes to bank 1 during ROM overlay are unspecified."
  - "Other RAM areas during overlay: probably pass through except ROM space; should ROM then be limited to the image size with BERR outside it?"
  - "IO ports repeating (mirroring) within their range is not stated."
  - "Per-peripheral interrupt.level is given but the YAML never states that GLUE encodes IPL2:0 and asserts ~VPA on IACK, nor which IRQ signals are physical nets (ENGINE, DUART, PORTS, CF -> GLUE) versus internal (~PS2_IRQ never leaves GLUE); a netlist diff will expect a ~PS2_IRQ net."

# Chip-to-chip interface contracts: parts, nets, and pinned numbers.  KiCad
# is the connectivity authority; this is the intent layer.  Read as a parts
# checklist before schematic entry; diff kicad_netlist_summary_2.py output
# against it after.  The per-chip contracts of the video chain are under
# their peripheral entries above.
interfaces:
  - |
    VGA R4G4B4 output stage: COMPOSITOR -> 2x 74AC541 -> weighted-resistor
    DAC -> DE-15.  14 CPLD signals: R[3:0], G[3:0], B[3:0] from COMPOSITOR,
    HSYNC, VSYNC from PIXEL.  U-a: R[3:0] + G[3:0]; U-b: B[3:0] + HSYNC +
    VSYNC.  Both /OE grounded.  Buffers are mandatory (ATF1508AS VOH is
    specified only to -2 mA; the MSB sources ~8.6 mA).
    DAC per channel (x3): binary-weighted ladder + shunt to ground.  bit3 =
    2x 1k parallel, bit2 = 1k, bit1 = 2x 1k series, bit0 = 3.9k, shunt =
    100R; 1k are 1% metal film (same batch), 3.9k may be 5%.
    Syncs: buffer -> 100R series -> DE-15 pins 13/14; no termination.
    DE-15: R=1, G=2, B=3, HS=13, VS=14; 5,6,7,8,10 + shell -> GND.
    BOM: 21x 1k 1%, 3x 3.9k, 5x 100R, 2x 74AC541.
    Layout: ladders + shunts at the DE-15, not at the buffers; 12 DAC traces
    short and roughly matched; solid ground return from shunts to shell.
  - |
    Stream FIFO parts: no 7200 data pin sits on D[15:0].  Each pipeline's
    FIFOs take their write data from a pair of 74AHCT541 unidirectional
    buffers (/OE tied low, inputs on the main bus, one chip per byte lane),
    placed with that pipeline so the main bus never runs to it: the video
    pair feeds D_VIDEO_FIFO[15:0] to the four PIXELS/VIDCMD parts, the
    audio pair feeds D_AUDIO_FIFO[15:0] to the five AUDIO parts.  The
    buffers are in the write-data path only; /W, /RS, /R, /EF and Q are
    unbuffered.  AHCT, not HCT: the buffer delay comes out of data setup
    at the 7200's /W rising edge (derived safe, griffin.log 2026-11-06).
    Main-bus loads per lane: see the IO data buffers entry.
    Video streams use 2x IDT7200 (256x9) each -- PIXELS ganged 16-bit
    (PIXELS_Q[15:0], ONE /RE from PIXEL driving both parts; PIXELS_Q[15:8] is
    the part on D[15:8]), VIDCMD ganged 16-bit (/RE from COMPOSITOR); each
    pair's /W pins are one ENGINE deposit strobe, nPIXELS_FIFO_W or
    nVIDCMD_FIFO_W, data pins on D_VIDEO_FIFO[15:0], /RS from PIXEL nRS.
    AUDIO uses five byte-wide IDT7200: channels 0 and 1 (left) have their
    data pins on D_AUDIO_FIFO[15:8], channels 2 and 3 (right) and the
    control FIFO on D_AUDIO_FIFO[7:0].  Their /W pins are ENGINE's nSAMPLES0..3_FIFO_W and
    nAUDCTL_FIFO_W; their /R and /EF pins go to the AUDIO CPLD (/R held
    low, pulsed high to advance); /RS from the system ~RESET.  Channel n's
    Q[7:0] drives its R-2R ladder directly (no inverter, no pull resistors:
    Q floats only while the FIFO is empty, when the channel's switch is
    open); the control FIFO's Q[7:0] goes to the AUDIO CPLD.  /HF
    unconnected.
    XI/XO cascade is an unpopulated-footprint option if depth is ever
    needed.
  - |
    IO data buffers: a 74AHCT245 pair, one per byte lane, between the main
    bus D[15:0] and D_IO[15:0], the data pins of the four IO-segment
    peripherals (GLUE, CF, DUART, PORTS; 0xF00000-0xFFFFFF).  A side =
    D_IO, B side = D; DIR = R/~W, so a read drives peripheral to bus; /OE =
    GLUE nIO_BUFFER_OE, low for every bus cycle in the segment and high
    otherwise, so the pair never drives the main bus while RAM, ROM, the
    CPU or ENGINE owns it.  The segment's selects, strobes, DTACK and IRQ
    lines are unbuffered.  Main-bus loads per lane: D[7:0] = CPU, 4 RAM,
    ROM, ENGINE, 2 FIFO write buffers, 1 IO buffer (10); D[15:8] the same
    (10).  Decided on the datasheet capacitance tally, griffin.log
    2026-11-06 and 2026-11-07.
  - |
    FIFO control strobes: every 7200 /RE and /W line (PIXELS, VIDCMD,
    AUDIO) has a series axial footprint at its driver, stuffed 0R; 33-47R
    only if a strobe rings on the bench.
  - |
    Palette RAM: 16 entries x 12 bits of separate-I/O static RAM between
    PIXEL and COMPOSITOR, built from three 16x4 parts (74F219 function table,
    non-inverting only), /CS tied low.
    ADDRESS: PIXEL IDX[3:0] (all three parts).  WRITE PULSE: PIXEL nCLUT_WE
    (all three).  DATA IN: COMPOSITOR set_pix_value[11:0], four bits per part
    -- PIXEL has no data path to the RAM at all.  DATA OUT: COMPOSITOR
    RGB_IN[11:0], combinational, no clock of its own.
    NOT RESET BY ANYTHING: no /RS, no power-on clear.  The RAM powers up
    undefined and software loads every entry it uses; contents persist across
    frames.  Write sequence and the pixel slots it disturbs: see PIXEL.
    The read path must close PIXEL tCO + flight + RAM address access + flight
    inside one pixel clock against COMPOSITOR tSU, so the part's tAA is a
    selection criterion, not a detail.
  - |
    PIXEL nVSYNC_IRQ -> GLUE nVSYNC: the level-6 frame IRQ, edge-latched
    in GLUE with W1C ack (VSYNC_STATUS/VSYNC_CLEAR).
  - |
    JTAG chain, six TAPs in this order: GLUE -> PORTS -> AUDIO -> ENGINE ->
    PIXEL -> COMPOSITOR.  Each link net is named {earlier}_TO_{later}_TD (TDO
    of the earlier chip to TDI of the later); the 1x6 programming header
    (TCK, TMS, TDI, TDO, +5V, GND) drives the first TDI and reads the last
    TDO.  There is no TIMING TAP.
  - |
    Power entry: the logic board is +5 V only. Board connector: keyed 6-position AMP MATE-N-LOK in
    the Apple II pinout -- VERIFY before silk.  +5 V and GND feed the
    board; +12 V, -12 V and -5 V are passed through, untouched, as bare
    copper to a 4-pin drive power connector (AMP 1-480424-0 style) at
    the case's single half-height bay.  Panel side: 5.5mm x 2.1mm
    center-positive barrel jack + inline switch to +5V and GND.
    Regulated 5V >= 2.5A brick.
  - |
    USB-C power entry, a stuffing option (the display build leaves the Rd
    pair off, so the socket is dead: a source never applies VBUS without
    seeing Rd).  6-pin power-only receptacle: VBUS, GND, CC1, CC2; 5.1k Rd
    on each CC; VBUS reaches +5V_IN only through the CC gate.  The gate
    admits a source only when one CC reads the 3 A advertisement (>= 1.25 V,
    the sink threshold between the 1.5 A and 3 A Rp bands): LM339 sections
    A and B compare CC1 and CC2 against 1.25 V from a halved TL431, their
    open-collector outputs wire-ORed as nGATE (low = admit).  nGATE drives
    two back-to-back logic-level P-FETs (NDP6020P, common source, gates
    tied) between VBUS and +5V_IN; the pair is both the load switch and
    the backfeed block, so a harness-powered board never drives VBUS.
    nGATE's 100k pull-up and 100 nF soft-start cap return to the FET
    common-source node, not to VBUS.  Section C lights the WEAK_SOURCE LED
    while nGATE is high (cable present, advertisement below 3 A); section
    D is unused, inputs tied off.  LM339, TL431 and LED are powered from
    VBUS, so nothing in the gate is live without a cable.  No capacitor on
    CC1 or CC2.  A harness-powered build leaves the LM339 out (a plugged
    cable would otherwise parallel the two supplies).  Background:
    reminders.md, USB-C power.
    Supervisor: DS1233-5 (the plain part, not the D variant: its RST pin
    doubles as a debounced pushbutton input).  The user button hangs on
    RST with no RC of its own.  RST reaches the system ~RESET net through
    a Schottky diode (anode on the net, cathode at RST): the supervisor
    and button pull the net low, while lows driven on the net -- the
    CPU's RESET instruction, the debug-header master -- never reach RST,
    so they cannot trip the pushbutton detect and be stretched.  RST also
    feeds GLUE's nSUPERVISOR_RESET input, the source of ~HALT assertion
    (next entry).  ~RESET net wire-OR drivers: the diode, the CPU, the
    debug-header master; no RC on the net.  Firmware never executes the
    RESET instruction: its pulse still resets GLUE (CONFIG clears, ROM
    overlay returns) under a still-running CPU.
  - |
    ~HALT open-drain wire-OR: GLUE drives it low while nSUPERVISOR_RESET
    is asserted (power-on, brownout, button -- and NOT the CPU's own
    RESET instruction, which GLUE does not echo back); the debug-header
    master may hold it with ~RESET for bus mastering.  GLUE also senses
    ~HALT for the DEBUG_OUT halt blink (see GLUE DEBUG_OUT).
  - |
    ENGINE -> GLUE status wires: ENGINE_ACTIVE and ENGINE_WAITING, plus
    the existing ~ENGINE_IRQ net, read back as GLUE ENGINE_STATUS.
  - |
    CF sideband: card INTRQ and IORDY -> GLUE, readable as GLUE CF_PINS;
    INTRQ is the level-1 interrupt (CONFIG.CF_IRQ_EN), IORDY qualifies
    the CF DTACK.
  - |
    Spare headers, 0.1 in, for a future daughter board; no logic behind
    them today.  (ENGINE's spare strobe header is gone: its pin became one
    of the seven deposit strobes.)  PORTS spare header: PORTS pins 34 and 41
    (unassigned I/O) and GND.  GLUE bodge spare: the one input-only pin named in glue.v's pinout header, routed to a pad.
  - |
    Clocks: three oscillators, no CPLD re-drives a clock.  SYSCLK (14 MHz
    can) -> CPU CLK and GCLK1 of GLUE, ENGINE and PORTS.  Pixel
    oscillator (25.175 MHz can) -> GCLK1 of PIXEL, COMPOSITOR and AUDIO.
    An optional second oscillator footprint (unstuffed, net CLK2) feeds
    PIXEL's free GCLK2 dedicated input.
    The DUART runs its own 3.6864 MHz crystal on X1/X2.
  - |
    Audio output stage, per side (x2, L and R identical; channels 0,1 are
    left, 2,3 right): each channel's 7200 Q[7:0] (offset binary, 0x80 =
    2.5 V = silence) -> 4610X-R2R-103LF 10k R-2R network ->
    one 74HC4066 switch, control = AUDIO GATE[n] -> the side's summing
    node.  The node is the inverting input of an LM358 half whose
    non-inverting input sits at 2.5 V (10k/10k divider + 10 uF, shared by
    both sides), so a ladder at midscale injects no current whether its
    switch is open or closed (no DC step with volume) and the two channels
    add without interacting.  Feedback 2k in parallel with 8.2 nF (single
    pole ~9.7 kHz, which also averages the 49 kHz gate pattern): full
    scale per channel +/-0.625 V, both +/-1.25 V about 2.5 V.  Then 4.7k
    to GND at the op-amp output (class-A bias) -> 100 uF AC coupling ->
    the LINE node.
    Three consumers hang on LINE, so the level there is knob-independent:
    (1) LINE OUT: LINE -> 100R series -> RCA jack (L and R, a pair).
    Fixed level, always on: 2.5 Vpp max ~= 0.88 Vrms at full scale.
    (2) VOLUME POT: dual-gang 10k audio taper, one gang per channel,
    element top to LINE, bottom to GND (the pot is the coupling cap's DC
    return), wiper out.
    (3) HEADPHONES: wiper -> 10k series / 1k to GND (~11:1 pad) -> LM386
    (gain 20) -> 10R + 47 nF Zobel -> 250 uF -> switched 3.5 mm stereo
    jack tip/ring.  ~1.6 Vrms max into 32 ohm (~80 mW); the knob sets it.
    Internal speaker (replaces the Rev 1 buzzer): the jack's
    normally-closed tip and ring switch contacts carry the two
    headphone-amp outputs; each feeds 47k into a mono sum at the speaker
    LM386 input, 1k to GND (~25:1 pad; the 1k also holds the input quiet
    when the contacts open) -> LM386 (gain 20) -> 10R + 47 nF Zobel ->
    250 uF -> 8 ohm speaker (~1.3 Vrms, ~200 mW).  Inserting a plug
    opens both contacts and mutes the speaker.  Behaviour: RCA line out
    ignores the knob; the knob governs headphones and speaker together;
    headphones mute the speaker.  Software mute is VOLUME 0 on all four
    channels and silences all three.
    Ladders, switches and summers placed at the FIFOs/RCAs; headphone
    amps at the 3.5 mm jack; pot and speaker are panel/case parts.  BOM:
    4x 4610X-R2R-103LF, 1x 74HC4066, 1x LM358, 3x LM386, dual 10kA pot +
    knob, 8-ohm speaker, 2x RCA jack, 1x switched 3.5 mm stereo jack;
    bias 2x 10k + 10 uF; per side 2k + 8.2 nF + 4.7k + 100R + 100 uF
    (summer/line), 10k + 1k (pad), 10R + 47 nF + 250 uF (headphone amp);
    speaker: 2x 47k sum, 1k, 10R + 47 nF, 250 uF.
  - |
    AUDIO chip (ATF1508AS PLCC84, cpld/audio/audio.v): CLK from the
    25.175 MHz pixel oscillator (a fourth GCLK1 load alongside PIXEL and
    COMPOSITOR), nRESET from the system ~RESET, HBLANK from PIXEL (a second
    load beside ENGINE's; its rising edge re-phases the by-16 divider each
    line, so period counters step at h_cnt 0 mod 16).  Inputs: the control
    FIFO's Q[7:0] and /EF, the four sample FIFOs' /EF.  Outputs: the five
    /R lines (held low; a one-clock high pulse advances; high through
    reset because the 7200 wants /R inactive while /RS is low) and
    GATE[3:0] to the 74HC4066 controls.  No 68000 bus, nothing read back.
    Test pads: the five /EF and PIXEL's AUDIO_TICK.  BOM: ATF1508AS.
  - |
    RS-232 level stage: both DUART channels are real RS-232 at the rear
    panel; the TTL bench headers remain.  One MAX232 per channel (its 2
    drivers + 2 receivers = TXD/RXD + RTS/CTS); ch B's DCD and RI come
    through a 75189 quad receiver (2 of 4 sections, unused inputs
    grounded) into DUART IP4/IP5.
    Ch A console: DB-25 FEMALE wired DCE.  Pin 2 -> receiver -> RXDA;
    TXDA -> driver -> pin 3; pin 4 (terminal RTS) -> receiver -> IP0
    (~CTS_A); OP0 (~RTS_A) -> driver -> pin 5 (terminal CTS); strap DSR
    (6) and DCD (8) to the terminal's DTR (20) at the connector; pin 7
    signal ground.
    Ch B modem port: DB-25 MALE wired DTE.  TXDB -> driver -> pin 2;
    pin 3 -> receiver -> RXDB; OP1 (~RTS_B) -> driver -> pin 4; pin 5 ->
    receiver -> IP1 (~CTS_B); pin 8 (DCD) -> 75189 -> IP4; pin 22 (RI)
    -> 75189 -> IP5; DTR (20) strapped to DSR (6) at the connector (a
    GLUE bodge spare can drive DTR later if ever wanted); pin 7 signal
    ground.
    Header/port coexistence: the DUART TX pins drive TTL header and
    MAX232 driver inputs in parallel.  The MAX232 receiver outputs
    (RXD_A, CTS_A, RXD_B, CTS_B) go straight to the DUART; the headers'
    RXD and CTS lines reach the DUART through 1k series resistors, so a
    stuffed MAX232 wins any collision.  10k pull-ups to +5 V on RXD_A,
    RXD_B, ~CTS_A, ~CTS_B, IP4 and IP5 hold the inputs at idle when the
    level stages are unstuffed.  No isolation jumpers; a bench cable is
    simply not plugged in while the RS-232 port is in use.
