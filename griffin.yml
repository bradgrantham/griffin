project:
  name: Griffin
  cpu: MC68010    # primary CPU for Rev 2 (68000 is a drop-in); VBR available to firmware
  clock_hz: 14000000
  interrupt_mode: autovector

peripherals:
  GLUE:
    part: ATF1508AS
    description: "System glue logic (also hosts PS/2 keyboard RX/TX)"
    address_range:
      base: 0xF00000
      size: 0x040000
      width: 8
    dtack:
      - 12000000: 0
      - 14000000: 0
      - 14318181: 0
      - 16000000: 0
      - 20000000: 0
    interrupt:
      level: 4
      signal: ~PS2_IRQ
    registers:
      - offset: 0x01
        name: DEBUG_OUT
        access: write
        width: 8
        description: "Set or clear DEBUG_OUT signal (debug LED and test point output)"
        bits:
          - { bit: "0", name: OUT, description: "DEBUG_OUT drive level" }
      - offset: 0x07
        name: CONFIG
        access: write
        width: 8
        description: "GLUE configuration register"
        bits:
          - { bit: "0", name: ROM_OVERLAY_DISABLE, default: 0,
              description: "Write 1 to disable ROM overlay and unmap ROM from RAM bank 1 address space" }
          - { bit: "1", name: FLASH_WE_EN, default: 0,
              description: "Write 1 to enable the ~ROM_WE strobe so ROM-window word writes reach the flash (JEDEC program/erase); 0 write-protects flash" }
      - offset: 0x09
        name: PS2_TX_DATA
        access: write
        width: 8
        description: |
          Byte to transmit host->device; the write itself starts the frame.
          GLUE presents the start bit on DATA, releases PS2_CLK (the CPU
          must have inhibited it >=100 us first via PS2_CTRL.CLK), then
          shifts start/8-data-LSB-first/parity/stop out on each device
          PS2_CLK falling edge and samples the device ACK into TX_ACK,
          raising TX_DONE (level-4 IRQ) on completion.

          This register spans two word slots: address bit 1 carries the
          firmware-computed odd-parity bit (no hardware XOR), so write
          to PS2_TX_DATA for parity 0 or PS2_TX_DATA+PS2_TX_DATA_PARITY
          (offset 0x0B) for parity 1.  Ignored while a TX or RX frame
          is already in progress.
        bits:
          - { bit: "7:0", name: DATA, description: "Data byte to send (write triggers TX)" }
      - offset: 0x11
        name: PS2_STATUS
        access: read
        width: 8
        description: |
          PS/2 frame-engine status.  GLUE assembles a full 11-bit RX
          frame (start/8-data-LSB-first/parity/stop) and raises one IRQ
          per byte via RX_READY; the data byte is read from PS2_RX_DATA.
          TX completion is signalled by TX_DONE.  Both are W1C via
          PS2_CLEAR.  Firmware validates RX parity from RX_PARITY.
        bits:
          - { bit: "0", name: RX_READY,
              description: "1 = a received byte is in PS2_RX_DATA; asserts level-4 IRQ; W1C via PS2_CLEAR" }
          - { bit: "1", name: TX_DONE,
              description: "1 = host->device frame finished; asserts level-4 IRQ; W1C via PS2_CLEAR" }
          - { bit: "2", name: TX_ACK,
              description: "Device ACK sampled on the final clock of the last TX (0 = acknowledged)" }
          - { bit: "3", name: RX_PARITY,
              description: "Received parity bit of the latched byte (firmware checks odd parity)" }
          - { bit: "4", name: RX_FRAME_ERR,
              description: "1 = received stop bit was not 1 (framing error)" }
          - { bit: "5", name: DATA_LIVE,
              description: "Unlatched synchronized PS2_DATA pin state (debug)" }
          - { bit: "6", name: CLK_LIVE,
              description: "Debounced PS2_CLK level the frame engine clocks on, not the raw pin (debug)" }
      - offset: 0x11
        name: PS2_CLEAR
        access: write
        width: 8
        description: |
          Write-1-to-clear for PS2_STATUS latched flags / IRQ ack.
          The GLUE level-4 IRQ de-asserts on the same cycle once both
          RX_READY and TX_DONE are clear.
        bits:
          - { bit: "0", name: RX_READY, description: "Write 1 to clear RX_READY (RX byte ISR ack)" }
          - { bit: "1", name: TX_DONE,  description: "Write 1 to clear TX_DONE (TX completion ISR ack)" }
      - offset: 0x13
        name: PS2_CTRL
        access: write
        width: 8
        description: |
          Open-drain drive control for PS2_CLK and PS2_DATA for the TX inhibit handshake.
          Each bit drives the pin low when set and tri-states to the
          external pull-up otherwise.  While a TX frame is in progress
          the engine owns both pins and ignores CLK here.
        bits:
          - { bit: "0", name: CLK,
              description: "1 = drive PS2_CLK low (inhibit device / request-to-send); 0 = tri-state" }
          - { bit: "1", name: DATA,
              description: "1 = drive PS2_DATA low; 0 = tri-state (pull-up high)" }
      - offset: 0x15
        name: PS2_RX_DATA
        access: read
        width: 8
        description: "Assembled PS/2 data byte; valid while RX_READY is set."
        bits:
          - { bit: "7:0", name: DATA, description: "Received scancode byte (LSB-first on the wire)" }
      - offset: 0x17
        name: VSYNC_STATUS
        access: read
        width: 8
        description: |
          Latched vsync frame interrupt status.
          TIMING has no CPU bus, so it cannot host an interrupt-acknowledge
          register; GLUE therefore latches the assertion edge of TIMING's
          VSYNC output (the same net that feeds the VGA connector, tapped
          before the 74AC541 buffer, 2-FF synchronized into the SYSCLK
          domain) and asserts the level-6 IRQ until the CPU clears it via
          VSYNC_CLEAR.  Replaces rev 1's ~VIDEO_IRQ from the retired VIDEO
          CPLD on the same GLUE pin.
        bits:
          - { bit: "0", name: VSYNC_PENDING,
              description: "1 = a vsync edge has been latched; asserts the level-6 IRQ; W1C via VSYNC_CLEAR" }
      - offset: 0x17
        name: VSYNC_CLEAR
        access: write
        width: 8
        description: "Write-1-to-clear for VSYNC_PENDING / level-6 IRQ ack."
        bits:
          - { bit: "0", name: VSYNC_PENDING, description: "Write 1 to clear VSYNC_PENDING (vsync ISR ack)" }

  # Rev 2 ROM (see griffin.md "Rev 2 components"): 2x SST39SF040 (512Kx8,
  # DIP-32, socketed), one per byte lane = 1MB on the 16-bit bus.  These are
  # 5V-only NOR flash: 4.5-5.5V for read AND program/erase, Vpp generated
  # on-chip, so the bench programmer (TL866II+, device "SST39SF040", DIP-32)
  # needs no adapter and no high-voltage supply.  Decode is unchanged from the
  # W27C512 build it replaces -- just A23 & ~A22 (2 literals): the 1MB image
  # mirrors 4x through the 4MB window at 0x800000-0xBFFFFF.  At reset the ROM
  # is also overlaid over RAM bank 1 until GLUE CONFIG bit ROM_OVERLAY_DISABLE
  # is set.  (All peripherals live in the other upper region, A23 & A22.)
  #
  # In-circuit reflash: GLUE drives ~ROM_WE to both chips' WE#, asserted only
  # for (A23 & ~A22) & ~R/W & AS & UDS & LDS & CONFIG.FLASH_WE_EN.  Three
  # things fall out of that qualification, all deliberate.  Requiring BOTH data
  # strobes means only word writes make a strobe, so a stray byte write cannot
  # feed a command to one x8 chip and desync the pair.  Qualifying on the raw
  # ROM region rather than nROM_SELECT means writes through the boot overlay at
  # 0x000000 never reach the flash, whatever the overlay bit says.  And
  # FLASH_WE_EN resets to 0, so firmware must deliberately unlock GLUE before
  # any write can get through at all.
  #
  # The two chips are driven as a pair and each runs its own byte-program on
  # its own lane, so every JEDEC command byte is duplicated into both halves of
  # a word: the unlock pair is word 0xAAAA to 0x80AAAA then 0x5555 to 0x805554.
  # Byte program is unlock + 0xA0A0 to 0x80AAAA + the data word at its address.
  # Sector erase is unlock + 0x8080 + unlock again + 0x3030 at any address in
  # the target sector; chip erase is the same but 0x1010 to 0x80AAAA last --
  # note both erases need the unlock pair twice, six write cycles total.
  # The parts decode only chip A14:0 for the command sequence, so
  # the upper address bits are don't-care and the ROM base drops out of the
  # arithmetic; chip 0x5555/0x2AAA land at CPU 0x80AAAA/0x805554 because chip
  # A0 is CPU A1.  A single word write then programs both bytes in parallel;
  # poll DQ7 (Data# polling) or DQ6 (toggle bit) in each lane independently
  # until both agree.  Sector erase is 4KB per chip = 8KB of CPU address space,
  # 8KB aligned.  Software Data Protection is permanently enabled on these
  # parts, so no write can take effect without the full unlock sequence.
  #
  # The flasher must run from RAM (linker section .ramtext) with the overlay
  # already disabled: during an embedded program or erase the flash returns
  # status rather than instructions, so an instruction or vector fetch out of
  # the ROM window mid-operation reads garbage.  Interrupts may stay enabled
  # only because the vector table and the hot ISRs are already in RAM and video
  # DMA only touches the framebuffer -- no handler may touch the ROM window.
  # Endurance is 10,000 cycles minimum (100,000 typical), and because the parts
  # are socketed a bricked image is recovered by pulling them and reprogramming
  # on the bench -- there is no bus-master bootstrap path in Rev 2.
  ROM:
    part: "2x SST39SF040-70 (512Kx8 DIP-32 5V NOR flash, socketed; 1MB total)"
    address_range:
      base: 0x800000
      size: 0x100000    # 1MB of actual ROM (2x 512KB, one per byte lane)
      window: 0x400000  # 4MB decode window; the image mirrors 4x within it
      width: 16
    dtack:
      - 12000000: 1
      - 14000000: 1
      - 14318181: 1
      - 16000000: 1
      - 20000000: 1
    linker:
      section: rom

  # Rev 2 RAM (see griffin.md "Rev 2 components"): 4MB as 4 banks x 1MB,
  # each bank a pair of AS6C4008 (512Kx8, DIP-32, socketed bin parts), one
  # chip per byte lane.  GLUE decodes nRAM_[1-4]_SEL from A21:20 (within
  # A23:22 == 00) and drives the WRITE_LO/WRITE_HI byte write strobes;
  # /OE from nR_W.  All four banks are always populated -- no partial
  # population, no RAM-sizing probe.
  RAM_BANK_1:
    part: "2x AS6C4008"
    address_range:
      base: 0x000000
      size: 0x100000
      width: 16
    dtack:
      - 12000000: 0
      - 14000000: 0
      - 14318181: 0
      - 16000000: 0
      - 20000000: 1
    linker:
      section: ram

  RAM_BANK_2:
    part: "2x AS6C4008"
    address_range:
      base: 0x100000
      size: 0x100000
      width: 16
    dtack:
      - 12000000: 0
      - 14000000: 0
      - 14318181: 0
      - 16000000: 0
      - 20000000: 1
    linker:
      section: ram

  RAM_BANK_3:
    part: "2x AS6C4008"
    address_range:
      base: 0x200000
      size: 0x100000
      width: 16
    dtack:
      - 12000000: 0
      - 14000000: 0
      - 14318181: 0
      - 16000000: 0
      - 20000000: 1
    linker:
      section: ram

  RAM_BANK_4:
    part: "2x AS6C4008"
    address_range:
      base: 0x300000
      size: 0x100000
      width: 16
    dtack:
      - 12000000: 0
      - 14000000: 0
      - 14318181: 0
      - 16000000: 0
      - 20000000: 1
    linker:
      section: ram

  # ENGINE takes nENGINE_SELECT from GLUE.  Self-decoding was considered for
  # Rev 2 (as bus master ENGINE already owns A, D, AS and R/W, so it could
  # watch the bus for its own region and free a GLUE pin) but was never built,
  # and the 2026-07-30 pinout freeze settled it: GLUE drives nENGINE_SELECT on
  # its pin 39 and ENGINE consumes it on pin 84, both in frozen //PIN: blocks,
  # so the net is committed for Rev 2.  Revisiting it is a board respin.
  ENGINE:
    part: ATF1508AS
    description: "Video framebuffer DMA engine with 7200 FIFO write interface"
    address_range:
      base: 0xD00000
      size: 0x100000
      width: [8, 16]
    dtack:
      - 12000000: 0
      - 14000000: 0
      - 14318181: 0
      - 16000000: 0
      - 20000000: 0
    interrupt:
      level: 3
      signal: ~ENGINE_IRQ
    registers:
      - offset: 0x03
        name: SOURCE_PAGE
        access: write
        width: 8
        description: |
          Framebuffer page: A[23:16] of source base address.
          Combined with 15-bit word counter for A[15:1].
          Framebuffer must be 64KB-aligned.
      - offset: 0x05
        name: CTRL
        access: write
        width: 8
        description: "DMA control register."
        bits:
          - { bit: "0", name: DMA_EN, default: 0,
              description: "1 = enable DMA, resets word counter. 0 = stop DMA, release bus." }
      - offset: 0x05
        name: STATUS
        access: read
        width: 8
        description: "DMA status readback."
        bits:
          - { bit: "0", name: DMA_EN,
              description: "Current DMA_EN state" }
          - { bit: "1", name: FIFO_HF,
              description: "1 = FIFO half-full (HF asserted, DMA paused)" }

  VIDEO:
    part: ATF1508AS
    description: "VGA 640x480@60 1bpp video generator with 7200 FIFO read interface"
    dtack:
      - 12000000: 0
      - 14000000: 0
      - 14318181: 0
      - 16000000: 0
      - 20000000: 0
    address_range:
      base: 0xE00000
      size: 0x100000
      width: [8, 16]
    interrupt:
      level: 6
      signal: ~VIDEO_IRQ
    # VESA 640x480@60 raster: 640x480 visible in an 800x525 scan, negative
    # sync polarity on both HSYNC and VSYNC.  Horizontal counts are in pixel
    # clocks, vertical counts in lines; each interval is active -> front
    # porch -> sync -> back porch, summing to the total.  These values must
    # match the H_*/V_* localparams in cpld/video/video.v (verified
    # 2026-07-28).  Derived rates: line = 25175000 / 800 = 31468.75 Hz (the
    # HSYNC tap PORTS uses), frame = 31468.75 / 525 ~= 59.94 Hz.
    # codegen.py currently ignores this block; it is emulator spec and a
    # cross-check against video.v, not yet an emitted-constants source.
    video_timing:
      pixel_clock_hz: 25175000   # dedicated pixel oscillator, not SYSCLK
      h_active:       640
      h_front_porch:  16
      h_sync:         96
      h_back_porch:   48
      h_total:        800
      v_active:       480
      v_front_porch:  10
      v_sync:         2
      v_back_porch:   33
      v_total:        525
      hsync_polarity: negative   # asserted low during the sync interval
      vsync_polarity: negative
      # The vsync IRQ latch (see CLRINT) is fed by a toggle event in the
      # pixel-clock domain at the last pixel of the first vsync line
      # (v == v_active + v_front_porch, h == h_total - 1), crossed into
      # SYSCLK through a 2-FF synchronizer -- so the CPU-visible latch sets
      # about one line after the VSYNC pin's falling (asserting) edge.
    registers:
      - offset: 0x03
        name: CLRINT
        access: write
        width: 8
        description: |
          Write any value to clear the latched VIDEO vsync IRQ.  IRQ is
          set on the rising edge of vsync and held until CLRINT is
          written, so firmware must acknowledge in the ISR before RTE.

          The vsync timing generator free-runs regardless of CTRL.ENABLE
          (it must already be running before ENABLE is set, since pixel
          output/FIFO reads start at the next vsync boundary), so the
          latch sets every frame whether or not video is enabled.  Gate
          the ~VIDEO_IRQ pin itself with CTRL.IRQENB before masking
          interrupts at the CPU, rather than relying on an ISR always
          being installed; the latch (this bit's target) still tracks
          vsync unconditionally, matching DUART's ISR/IMR split.
      - offset: 0x05
        name: CTRL
        access: write
        width: 8
        description: "Video control register."
        bits:
          - { bit: "0", name: ENABLE,
              description: "1 = pixel output and FIFO reads active; 0 = black screen, no reads. Enable after ENGINE." }
          - { bit: "1", name: IRQENB, default: 0,
              description: "1 = drive ~VIDEO_IRQ from the latched vsync IRQ; 0 = pin stays deasserted regardless of the latch. Latch still sets every frame either way (see CLRINT); ack with CLRINT before re-enabling to avoid an immediate stale IRQ." }
      - offset: 0x05
        name: CTRL_RB
        access: read
        width: 8
        description: "Video control readback."
        bits:
          - { bit: "0", name: ENABLE,
              description: "Current ENABLE state" }
          - { bit: "1", name: FIFO_ERROR,
              description: "Sticky: 9th-bit toggle mismatch detected (FIFO sync lost). Clear with CLRERR." }
          - { bit: "2", name: IRQENB,
              description: "Current IRQENB state" }
      - offset: 0x09
        name: CLRERR
        access: write
        width: 8
        description: "Write any value to clear FIFO_ERROR sticky bit."
        # Palette is no longer a CPU register: the per-line fg/bg pair travels
        # in-band as the first word of each scanline (see VIDEO_LINE_* constants)
        # and VIDEO latches it from the FIFO during hblank.  The former PALETTE
        # (0x0E) and STATUS/LINE_TOGGLE (0x07) registers are retired.

  # PORTS has no bus-timing logic of its own: GLUE decodes the region and
  # hands over ~PORTS_SELECT and answers DTACK for it, as it does for CF.
  # The line time base is the VGA HSYNC net tapped from VIDEO 
  # the paddle counters tick at the full 31.469 kHz line rate and the
  # audio FIFO pop runs at half that (15.73 kS/s, AUDIO_SAMPLES_PER_SECOND)
  #
  # The mouse channel deliberately mirrors GLUE's keyboard register layout at
  # the same offsets (TX_DATA 0x09, STATUS/CLEAR 0x11, CTRL 0x13, RX_DATA
  # 0x15) 
  PORTS:
    part: ATF1508AS
    description: "PS/2 mouse, two joystick ports, two paddle counters, and the audio FIFO pop strobe"
    address_range:
      base: 0xFC0000
      size: 0x040000
      width: 8
    dtack:
      - 12000000: 0
      - 14000000: 0
      - 14318181: 0
      - 16000000: 0
      - 20000000: 0
    interrupt:
      level: 2
      signal: ~PORTS_IRQ
    registers:
      - offset: 0x01
        name: JOYSTICK_PORT_1
        access: read
        width: 8
        description: |
          Joystick port 1 switches, active low (0 = closed).
          This is the port that also hosts the paddles: PIN9/PIN5 double as
          SMS-pad button 2 and the raw paddle pot comparator levels, and the
          paddle fire buttons appear on LEFT/RIGHT (DE-9 pins 3/4) per the
          2600 convention.  Poll from the vsync ISR; there is no interrupt.
          Bit 7 reads 1.
        bits:
          - { bit: "0", name: UP,    description: "Port 1 up, DE-9 pin 1 (0 = pressed)" }
          - { bit: "1", name: DOWN,  description: "Port 1 down, DE-9 pin 2" }
          - { bit: "2", name: LEFT,  description: "Port 1 left, DE-9 pin 3 (also paddle B fire)" }
          - { bit: "3", name: RIGHT, description: "Port 1 right, DE-9 pin 4 (also paddle A fire)" }
          - { bit: "4", name: FIRE,  description: "Port 1 fire, DE-9 pin 6" }
          - { bit: "5", name: PIN9,  description: "Port 1 DE-9 pin 9: SMS button 2 / paddle A pot level" }
          - { bit: "6", name: PIN5,  description: "Port 1 DE-9 pin 5: paddle B pot level" }
      - offset: 0x03
        name: JOYSTICK_PORT_2
        access: read
        width: 8
        description: |
          Joystick port 2 switches, active low (0 = closed).
          Same bit order as JOYSTICK_PORT_1, with no paddles on this port.
          Bit 7 reads 1.
        bits:
          - { bit: "0", name: UP,    description: "Port 2 up, DE-9 pin 1 (0 = pressed)" }
          - { bit: "1", name: DOWN,  description: "Port 2 down, DE-9 pin 2" }
          - { bit: "2", name: LEFT,  description: "Port 2 left, DE-9 pin 3" }
          - { bit: "3", name: RIGHT, description: "Port 2 right, DE-9 pin 4" }
          - { bit: "4", name: FIRE,  description: "Port 2 fire, DE-9 pin 6" }
          - { bit: "5", name: PIN9,  description: "Port 2 DE-9 pin 9: SMS button 2" }
          - { bit: "6", name: PIN5,  description: "Port 2 DE-9 pin 5 (spare input)" }
      - offset: 0x05
        name: PADDLE_A_COUNT
        access: read
        width: 8
        description: |
          Paddle A position, the pot on port 1 pin 9.
          An 8-bit counter advances once per VGA line while the pot's RC ramp
          holds the comparator sense low, and freezes when the ramp crosses,
          so the count is proportional to pot resistance (2600-style).  It
          saturates at 0xFF instead of wrapping, and full scale is 255 lines
          ~= 8.1 ms, half a frame.  Values need per-unit software calibration:
          the comparator threshold varies and the pot parallels the 1M
          pin-5/9 pull-up.
        bits:
          - { bit: "7:0", name: COUNT, description: "Line-rate count, saturating at 0xFF" }
      - offset: 0x07
        name: PADDLE_B_COUNT
        access: read
        width: 8
        description: |
          Paddle B position, the pot on port 1 pin 5.
          Identical in behaviour to PADDLE_A_COUNT and cleared by the same
          PADDLE_CONTROL DUMP bit.
        bits:
          - { bit: "7:0", name: COUNT, description: "Line-rate count, saturating at 0xFF" }
      - offset: 0x09
        name: PS2_MOUSE_TX_DATA
        access: write
        width: 8
        description: |
          Byte to transmit host->mouse; the write itself starts the frame.
          PORTS presents the start bit on DATA, releases PS2_MOUSE_CLK (the
          CPU must have inhibited it >=100 us first via PS2_MOUSE_CTRL.CLK),
          then shifts start/8-data-LSB-first/parity/stop out on each device
          clock falling edge and samples the device ACK into TX_ACK, raising
          TX_DONE (level-2 IRQ) on completion.

          This register spans two word slots: address bit 1 carries the
          firmware-computed odd-parity bit (no hardware XOR), so write
          to PS2_MOUSE_TX_DATA for parity 0 or PS2_MOUSE_TX_DATA +
          PS2_TX_DATA_PARITY (offset 0x0B) for parity 1 -- the same constant
          the GLUE keyboard channel uses.  Ignored while a TX or RX frame is
          already in progress.
        bits:
          - { bit: "7:0", name: DATA, description: "Data byte to send (write triggers TX)" }
      - offset: 0x0F
        name: PADDLE_CONTROL
        access: write
        width: 8
        description: |
          Paddle measurement control, written once per vsync ISR.
          Setting DUMP drives the discharge-FET line and holds both counters
          at zero; clearing it releases the caps and starts the next
          measurement.  This replaces the rev-1 two-pin DUART OP4/OP5 dance,
          which needed the dump and clear lines driven in opposite states.
        bits:
          - { bit: "0", name: DUMP, default: 0,
              description: "1 = drain the paddle caps and hold both counters at zero; 0 = measure" }
      - offset: 0x11
        name: PS2_MOUSE_STATUS
        access: read
        width: 8
        description: |
          PS/2 mouse frame-engine status.  PORTS assembles a full 11-bit RX
          frame (start/8-data-LSB-first/parity/stop) and raises one IRQ
          per byte via RX_READY; the data byte is read from
          PS2_MOUSE_RX_DATA.  TX completion is signalled by TX_DONE.  Both
          are W1C via PS2_MOUSE_CLEAR.  Bit layout is identical to GLUE's
          keyboard PS2_STATUS.
        bits:
          - { bit: "0", name: RX_READY,
              description: "1 = a received byte is in PS2_MOUSE_RX_DATA; asserts level-2 IRQ; W1C via PS2_MOUSE_CLEAR" }
          - { bit: "1", name: TX_DONE,
              description: "1 = host->device frame finished; asserts level-2 IRQ; W1C via PS2_MOUSE_CLEAR" }
          - { bit: "2", name: TX_ACK,
              description: "Device ACK sampled on the final clock of the last TX (0 = acknowledged)" }
          - { bit: "3", name: RX_PARITY,
              description: "Received parity bit of the latched byte (firmware checks odd parity)" }
          - { bit: "4", name: RX_FRAME_ERR,
              description: "1 = received stop bit was not 1 (framing error)" }
          - { bit: "5", name: DATA_LIVE,
              description: "Unlatched synchronized PS2_MOUSE_DATA pin state (debug)" }
          - { bit: "6", name: CLK_LIVE,
              description: "Debounced PS2_MOUSE_CLK level the frame engine clocks on, not the raw pin (debug)" }
      - offset: 0x11
        name: PS2_MOUSE_CLEAR
        access: write
        width: 8
        description: |
          Write-1-to-clear for PS2_MOUSE_STATUS latched flags / IRQ ack.
          The level-2 IRQ de-asserts on the same cycle once both RX_READY
          and TX_DONE are clear and the audio half-full latch is also clear
          (PORTS wire-ORs its interrupt sources onto one pin).
        bits:
          - { bit: "0", name: RX_READY, description: "Write 1 to clear RX_READY (RX byte ISR ack)" }
          - { bit: "1", name: TX_DONE,  description: "Write 1 to clear TX_DONE (TX completion ISR ack)" }
      - offset: 0x13
        name: PS2_MOUSE_CTRL
        access: write
        width: 8
        description: |
          Open-drain drive control for PS2_MOUSE_CLK and PS2_MOUSE_DATA for the TX inhibit handshake.
          Each bit drives the pin low when set and tri-states to the
          external pull-up otherwise.  While a TX frame is in progress
          the engine owns both pins and ignores CLK here.
        bits:
          - { bit: "0", name: CLK,
              description: "1 = drive PS2_MOUSE_CLK low (inhibit device / request-to-send); 0 = tri-state" }
          - { bit: "1", name: DATA,
              description: "1 = drive PS2_MOUSE_DATA low; 0 = tri-state (pull-up high)" }
      - offset: 0x15
        name: PS2_MOUSE_RX_DATA
        access: read
        width: 8
        description: "Assembled PS/2 mouse data byte; valid while RX_READY is set."
        bits:
          - { bit: "7:0", name: DATA, description: "Received packet byte (LSB-first on the wire)" }
      - offset: 0x1F
        name: AUDIO_CONTROL
        access: write
        width: 8
        description: |
          Audio FIFO pop control.  ENABLE gates the read strobe PORTS sends
          to both 7200s on every second VGA line, so clearing it freezes the
          DACs on their last sample without disturbing FIFO contents.
          CLEAR_HF_IRQ is the write-1-to-clear ack for the half-full
          interrupt reported in AUDIO_STATUS.
        bits:
          - { bit: "0", name: ENABLE, default: 0,
              description: "1 = pop one stereo sample pair every second line (15.73 kS/s); 0 = hold" }
          - { bit: "1", name: CLEAR_HF_IRQ,
              description: "Write 1 to clear the latched half-full IRQ (refill ISR ack)" }
      - offset: 0x1F
        name: AUDIO_STATUS
        access: read
        width: 8
        description: |
          Audio FIFO pop status.  HF_IRQ latches when the 7200 half-full
          flag rises, meaning the FIFO drained below half and firmware
          should refill; it asserts the shared level-2 IRQ until cleared
          with AUDIO_CONTROL.CLEAR_HF_IRQ.  HALF_FULL is the live
          synchronized flag for polling instead.
        bits:
          - { bit: "0", name: HF_IRQ,
              description: "1 = FIFO dropped below half full since the last ack; asserts level-2 IRQ" }
          - { bit: "1", name: HALF_FULL,
              description: "Live synchronized 7200 flag: 1 = half full or more" }
          - { bit: "2", name: ENABLE,
              description: "Current AUDIO_CONTROL ENABLE state" }

  # Rev 2: 16-bit True IDE PIO (rev 1 ran 8-bit via SET_FEATURES).  The
  # 16-bit DATA port is word offset 0x00; task-file registers remain
  # byte-wide on D7-D0 at the odd offsets.  GLUE gates IOWR with AS
  # (rev-1 carryover fix: R/~W alone left IOWR rising after AS was gone).
  CF:
    part: "Compact Flash (True IDE)"
    description: "Storage via CF card in True IDE 16-bit PIO mode"
    address_range:
      base: 0xF40000
      size: 0x040000
      width: [8, 16]
    dtack:
      - 12000000: 7
      - 14000000: 7
      - 14318181: 7
      - 16000000: 8
      - 20000000: 12
    registers:
      - { offset: 0x00, name: DATA,         access: rw,    width: 16,
          description: "16-bit data port to/from the CF card" }
      - { offset: 0x03, name: ERROR,        access: read,  width: 8,
          description: "Error register; valid after a command error" }
      - { offset: 0x03, name: FEATURES,     access: write, width: 8,
          description: "Features register; written before issuing SET_FEATURES command" }
      - { offset: 0x05, name: SECTOR_COUNT, access: rw,    width: 8,
          description: "Number of sectors to transfer" }
      - { offset: 0x07, name: SECTOR_NUM,   access: rw,    width: 8,
          description: "LBA bits 7:0" }
      - { offset: 0x09, name: CYL_LO,       access: rw,    width: 8,
          description: "LBA bits 15:8" }
      - { offset: 0x0B, name: CYL_HI,       access: rw,    width: 8,
          description: "LBA bits 23:16" }
      - { offset: 0x0D, name: DRIVE_HEAD,   access: rw,    width: 8,
          description: "LBA bits 27:24 and drive select; OR with CF_DH_LBA for LBA mode" }
      - { offset: 0x0F, name: STATUS,       access: read,  width: 8,
          description: "Device status; poll BSY clear and DRQ set before data transfer" }
      - { offset: 0x0F, name: COMMAND,      access: write, width: 8,
          description: "Issue command; write after setting all other registers" }

  DUART:
    part: "XR68C681"
    description: "Console (Ch A) and second serial (Ch B), 100 Hz systick C/T, GP pins for flow control / DS3231 I2C"
    clock: 3686400
    # pin_allocation -- hardware wiring of the general-purpose OP/IP pins.
    # NOTE the 68681 OP pins drive the COMPLEMENT of their OPR bits: setting
    # an OPR bit (via OPR_SET) drives the pin LOW.  Comments below describe
    # PIN levels; see the DUART_OP_*/DUART_IP_* mask constants.
    #   OP0: ~RTS_A (channel A request-to-send)   IP0: ~CTS_A
    #   OP1: ~RTS_B                               IP1: ~CTS_B
    #   OP2: RTC_SCL (DS3231 I2C clock, push-pull; DS3231 never stretches)
    #   OP3: RTC_SDA_DRIVE (N-FET gate: pin high pulls SDA low)
    #                                             IP2: RTC_SDA readback
    #                                             IP3: DS3231 ~INT (optional
    #                                                  change-detect 1Hz/alarm IRQ)
    #   OP4..OP7 spare                            IP4, IP5 spare
    # (OP4/OP5 drove the rev-1 paddle dump and '590 clear lines; rev 2 does
    #  both from the PORTS PADDLE_CONTROL DUMP bit, so they are free.)
    address_range:
      base: 0xF80000
      size: 0x040000
      width: 8
    interrupt:
      level: 5
      signal: ~DUART_IRQ
    dtack: ~DUART_DTACK  # handshake: 68681 drives this signal to assert DTACK
    berr_timeout: 256
    registers:
      - { offset: 0x01, name: MR1A,   access: rw,    width: 8,
          description: "Channel A mode register 1 (after reset or MR pointer reset)" }
      - { offset: 0x01, name: MR2A,   access: rw,    width: 8,
          description: "Channel A mode register 2 (second access after MR pointer reset)" }
      - offset: 0x03
        name: SRA
        access: read
        width: 8
        description: "Channel A status register"
        bits:
          - { bit: "0", name: RXRDY, description: "Receiver ready" }
          - { bit: "1", name: FFULL, description: "FIFO full" }
          - { bit: "2", name: TXRDY, description: "Transmitter ready" }
          - { bit: "3", name: TXEMT, description: "Transmitter empty" }
          - { bit: "4", name: OE,    description: "Overrun error" }
          - { bit: "5", name: PE,    description: "Parity error" }
          - { bit: "6", name: FE,    description: "Framing error" }
          - { bit: "7", name: RB,    description: "Received break" }
      - { offset: 0x03, name: CSRA,   access: write, width: 8,
          description: "Channel A clock select register" }
      - offset: 0x05
        name: CRA
        access: write
        width: 8
        description: "Channel A command register"
        bits:
          - { bit: "1:0", name: EC,  description: "Enable command: 0=no action, 1=enable RX, 2=disable RX" }
          - { bit: "3:2", name: TC,  description: "Transmitter command: 0=no action, 1=enable TX, 2=disable TX" }
          - { bit: "6:4", name: MC,  description: "Misc command: 1=reset MR ptr, 2=reset RX, 3=reset TX, 4=reset error, 5=reset break, 6=start break, 7=stop break" }
      - { offset: 0x07, name: RBA,    access: read,  width: 8,
          description: "Channel A receiver buffer (read to dequeue FIFO)" }
      - { offset: 0x07, name: TBA,    access: write, width: 8,
          description: "Channel A transmitter buffer (write to enqueue)" }
      - { offset: 0x09, name: IPCR,   access: read,  width: 8,
          description: "Input port change register (read clears interrupt)" }
      - offset: 0x09
        name: ACR
        access: write
        width: 8
        description: "Auxiliary control register (timer/counter mode, BRG set select)"
        bits:
          - { bit: "7",   name: BRG_SET,     description: "0 = BRG set 0; 1 = BRG set 1 (selects CSRA/CSRB rate table)" }
          - { bit: "6:4", name: CT_MODE,     description: "C/T mode + clock: 6=Timer X1/CLK, 7=Timer X1/CLK÷16, 3=Counter X1/CLK÷16" }
          - { bit: "3",   name: IP3_INT_EN,  description: "IP3 change-of-state IRQ enable" }
          - { bit: "2",   name: IP2_INT_EN,  description: "IP2 change-of-state IRQ enable" }
          - { bit: "1",   name: IP1_INT_EN,  description: "IP1 change-of-state IRQ enable" }
          - { bit: "0",   name: IP0_INT_EN,  description: "IP0 change-of-state IRQ enable" }
      - offset: 0x0B
        name: ISR
        access: read
        width: 8
        description: "Interrupt status register"
        bits:
          - { bit: "0", name: TXRDYA,      description: "Channel A TX ready" }
          - { bit: "1", name: RXRDYA,      description: "Channel A RX ready/FIFO full" }
          - { bit: "2", name: DELTA_BRKA,  description: "Channel A break change" }
          - { bit: "3", name: CTR_READY,   description: "Counter/timer ready" }
          - { bit: "4", name: TXRDYB,      description: "Channel B TX ready" }
          - { bit: "5", name: RXRDYB,      description: "Channel B RX ready/FIFO full" }
          - { bit: "6", name: DELTA_BRKB,  description: "Channel B break change" }
          - { bit: "7", name: IPC,         description: "Input port change" }
      - { offset: 0x0B, name: IMR,    access: write, width: 8,
          description: "Interrupt mask register (same bit layout as ISR; 1=enabled)" }
      - { offset: 0x0D, name: CUR,    access: read,  width: 8,
          description: "Counter/timer upper byte (current value)" }
      - { offset: 0x0D, name: CTUR,   access: write, width: 8,
          description: "Counter/timer upper preload register" }
      - { offset: 0x0F, name: CLR,    access: read,  width: 8,
          description: "Counter/timer lower byte (current value)" }
      - { offset: 0x0F, name: CTLR,   access: write, width: 8,
          description: "Counter/timer lower preload register" }
      - { offset: 0x11, name: MR1B,   access: rw,    width: 8,
          description: "Channel B mode register 1 (after reset or MR pointer reset)" }
      - { offset: 0x11, name: MR2B,   access: rw,    width: 8,
          description: "Channel B mode register 2 (second access after MR pointer reset)" }
      - { offset: 0x13, name: SRB,    access: read,  width: 8,
          description: "Channel B status register (same bit layout as SRA)" }
      - { offset: 0x13, name: CSRB,   access: write, width: 8,
          description: "Channel B clock select register" }
      - { offset: 0x15, name: CRB,    access: write, width: 8,
          description: "Channel B command register (same bit layout as CRA)" }
      - { offset: 0x17, name: RBB,    access: read,  width: 8,
          description: "Channel B receiver buffer (read to dequeue FIFO)" }
      - { offset: 0x17, name: TBB,    access: write, width: 8,
          description: "Channel B transmitter buffer (write to enqueue)" }
      - { offset: 0x19, name: IVR,    access: rw,    width: 8,
          description: "Interrupt vector register" }
      - { offset: 0x1B, name: IP,     access: read,  width: 8,
          description: "Input port (unlatched)" }
      - { offset: 0x1B, name: OPCR,   access: write, width: 8,
          description: "Output port configuration register" }
      - { offset: 0x1D, name: STARTCC, access: read, width: 8,
          description: "Start counter/timer command (read to start; data ignored)" }
      - { offset: 0x1D, name: OPR_SET, access: write, width: 8,
          description: "Output port bit set (1 bits set corresponding OP pins)" }
      - { offset: 0x1F, name: STOPCC,  access: read, width: 8,
          description: "Stop counter/timer command (read to stop; data ignored)" }
      - { offset: 0x1F, name: OPR_CLR, access: write, width: 8,
          description: "Output port bit reset (1 bits clear corresponding OP pins)" }

  # Direct-bus peripheral region, 0xC00000-0xCFFFFF (see griffin.md "Rev 2
  # components"): one 1MB region split into four 256KB quadrants by A19:18,
  # holding "dumb" peripherals whose data pins sit directly on the bus.
  # GLUE emits two fully-timed region strobes -- ~IO_RD_EN (region & AS &
  # R/W) and ~IO_WR_EN (region & UDS & LDS & ~R/W, so only deliberate
  # full-word writes qualify) -- and a 74155 dual 2-to-4 decoder fans them
  # out by A19:18 (section 1: 1C high, 1G = ~IO_RD_EN -> read strobes;
  # section 2: 2C low, 2G = ~IO_WR_EN -> write strobes).  GLUE never
  # touches the data path, and future direct peripherals cost zero GLUE
  # pins -- one spare read strobe and two spare write strobes remain.
  #   0xC00000  AUDIO     (7200 FIFO pair, ~AUDIO_W = write Y0)
  #   0xC40000  reserved  (was JOYSTICK '245 pair; joysticks are PORTS registers now)
  #   0xC80000  reserved  (was PADDLE '590 pair; paddle counters are in PORTS now)
  #   0xCC0000  reserved  (candidate: ENGINE COPY-FIFO read + write ports)
  # (0xFC0000, the rev-1 74HC373 AUDIO latch slot, is the PORTS CPLD.)
  AUDIO:
    part: "2x IDT7200 FIFO + 2x 8-bit R2R DAC"
    description: "Stereo FIFO audio output, drained at half the VGA line rate by PORTS"
    address_range:
      base: 0xC00000
      size: 0x040000
      width: 16
    dtack:
      - 12000000: 0
      - 14000000: 0
      - 14318181: 0
      - 16000000: 0
      - 20000000: 0
    # No interrupt entry: the 7200 half-full flag is wired to the PORTS CPLD,
    # which latches it and reports it through ~PORTS_IRQ at level 2 (see
    # PORTS AUDIO_STATUS.HF_IRQ).  There is no separate ~AUDIO_IRQ line.
    registers:
      - offset: 0x00
        name: FIFO
        access: write
        width: 16
        description: |
          Write one stereo sample pair into the audio FIFOs.
          Left channel is D15-D8, right channel is D7-D0, each an unsigned
          8-bit sample landing directly in its 7200.  ~AUDIO_W comes from
          the 74155 write section gated by GLUE ~IO_WR_EN, which qualifies
          on UDS & LDS & ~R/W -- only deliberate full-word writes clock
          the FIFOs (no A17 alias trick needed).  PORTS drives the FIFO
          read strobe at half the 31.469 kHz line rate (~15.7 kS/s, see
          AUDIO_SAMPLES_PER_SECOND) by dividing the HSYNC tap by two -- not
          VIDEO, and not a programmable divider.  The FIFO half-full flag
          goes to PORTS, which latches it into ~PORTS_IRQ (autovector level
          2); the ISR refills at most AUDIO_FIFO_DEPTH/2 = 128 pairs (~8 ms
          of headroom) per service and acks with PORTS AUDIO_CONTROL.


constants:
  CF_STATUS_BSY:   0x80
  CF_STATUS_DRDY:  0x40
  CF_STATUS_DRQ:   0x08
  CF_STATUS_ERR:   0x01
  CF_CMD_READ_SECTORS:  0x20
  CF_CMD_WRITE_SECTORS: 0x30
  CF_CMD_IDENTIFY:      0xEC
  CF_CMD_SET_FEATURES:  0xEF
  CF_CMD_SET_8BIT:      0x01   # rev-1 8-bit PIO only; unused with rev-2 16-bit DATA port
  CF_DH_LBA:            0xE0
  PS2_RX_QUEUE_SIZE:    64

  # Audio FIFO geometry (2x IDT7200: 256 x 9 each; one per channel).
  # Was 2x IDT7202 (1024 deep); 7202s are hard to source (2026-08-13), and
  # the 7200 depth is sufficient: half-full = 128 pairs = 8.1 ms of runway,
  # refill IRQ ~123 Hz, and the display-list AUDIO_FIFO_W path held 49..93
  # pairs of occupancy in the validated use cases.  If depth is ever needed,
  # the 7200 family cascades via XI/XO.
  AUDIO_FIFO_DEPTH:          256
  AUDIO_SAMPLES_PER_SECOND:  15734   # half the 31.469 kHz VGA line rate

  # DUART OP/IP masks for the pin_allocation block above.  Reminder: OP pins
  # drive the COMPLEMENT of their OPR bits (OPR_SET drives the pin low), and
  # RTC_SDA_DRIVE has a second inversion through the N-FET (pin high = SDA low).
  # OP4 and OP5 are free in rev 2: they drove the rev-1 paddle dump and clear
  # lines, which are now the single PORTS PADDLE_CONTROL DUMP bit.
  DUART_OP_RTC_SCL:        0x04   # OP2
  DUART_OP_RTC_SDA_DRIVE:  0x08   # OP3
  DUART_IP_RTC_SDA:        0x04   # IP2
  DUART_IP_RTC_NINT:       0x08   # IP3
  RTC_I2C_ADDR:            0x68   # DS3231 7-bit I2C address

  # PS/2 TX parity is carried in address bit 1 of PS2_TX_DATA:
  #   write GLUE_PS2_TX_DATA + (parity ? PS2_TX_DATA_PARITY : 0)
  PS2_TX_DATA_PARITY:   0x02

  # ENGINE bus-arbitration burst chunk: words transferred per BR/BGACK cycle
  # before releasing the bus.  Deliberately shorter than a scanline so a single
  # burst (~2.86 us at 2 CPUCLK cycles/word) cannot occupy the whole hblank
  # (~6.35 us), and long enough to amortize the ~10-cycle BR/BG/BGACK
  # handshake that starts each burst.
  ENGINE_WORDS_PER_BURST: 20

  # Palette-and-pixels framebuffer layout.  Each scanline in memory is a
  # 4-byte header followed by the 80 pixel bytes:
  #   bytes 0..1 = palette word {fg, bg} (R3G3B2 each), latched in-band by
  #               VIDEO during hblank ahead of the line's pixels
  #   bytes 2..3 = reserved (keeps the stride a multiple of 4 so firmware's
  #               long-aligned framebuffer movers / fast scroll still work)
  #   bytes 4..83 = 80 pixel bytes (640 px, 1bpp, MSB-leftmost)
  # ENGINE streams VIDEO_WORDS_PER_LINE 16-bit words per line; VIDEO consumes
  # the same count, so palette and pixels stay FIFO-synchronized with no CPU
  # involvement.
  VIDEO_PIXEL_BYTES_PER_LINE: 80
  VIDEO_LINE_PIXEL_OFFSET:     4      # byte offset of pixel data within a line
  VIDEO_LINE_STRIDE_BYTES:     84     # 4-byte header + 80 pixel bytes
  VIDEO_WORDS_PER_LINE:        42     # stride / 2
  ENGINE_WORDS_PER_FRAME:      20160  # 480 lines * 42 words

  # --- Rev 2 super-engine video path: shared numeric contracts ------------
  # Sources of truth today: super-engine/descriptor.h (encodings and their
  # rationale), cpld/{engine/engine.v,compositor/compositor.v,pixel/*.v}
  # (implementations), vidcmd-spec.md (semantics).  These constants are the
  # numbers more than one component must agree on; the full bit-level VIDCMD
  # encoders stay in descriptor.h until the format is frozen enough to teach
  # codegen.

  # ENGINE descriptor word0 one-hot strobe mask bits (3 assigned + 1 spare;
  # bits [6:4] of the field were reclaimed when the strobes shrank from 7).
  ENGINE_SIGNAL_PIXELS_FIFO_W:  0x01
  ENGINE_SIGNAL_VIDCMD_FIFO_W:  0x02
  ENGINE_SIGNAL_AUDIO_FIFO_W:   0x04

  # VIDCMD SET instruction target numbering {1, ttt, value[11:0]}.
  # 0..1 are COMPOSITOR-local; 2..6 are forwarded to PIXEL over the
  # valid/target/commit handshake; 7 is spare.
  VIDCMD_SET_CMP_HELD_FG:    0
  VIDCMD_SET_CMP_HELD_BG:    1
  VIDCMD_SET_PIX_PAL_FG:     2
  VIDCMD_SET_PIX_PAL_BG:     3
  VIDCMD_SET_PIX_HAM_HELD:   4
  VIDCMD_SET_PIX_MODE:       5
  VIDCMD_SET_PIX_PIXEL_SKIP: 6

  # Stream FIFOs (2x IDT7200 256x9 per stream, 16-bit word per pair for
  # VIDCMD; byte-interleaved shared-Q pair for PIXELS).
  PIXELS_FIFO_WORDS: 256
  VIDCMD_FIFO_WORDS: 256

  # Out-of-band pixel stream lengths (no in-band header in the Rev 2 path):
  # 1bpp direct = 1 bit/px, 2bpp micro-HAM = exactly 2 stream bits/px clock.
  PIXELS_WORDS_PER_LINE_1BPP: 40
  PIXELS_WORDS_PER_LINE_HAM:  80

  # Pipeline lead constants — DERIVED, NOT TUNED (rev2_interfaces contract).
  # Every stage's fixed latency is absorbed by firing TIMING's comparators
  # early by exactly that amount.
  COMPOSITOR_LEAD:    2    # consume edge + registered RGB_OUT, measured by compositor_tb
  PIXEL_OUT_LEAD:     1    # ham_held -> registered RGB_OUT inside PIXEL
  TIMING_SPLIT_LEAD:  1    # TIMING->PIXEL registered strobe hop (two-chip split)
  DAC_LEAD:           4    # sum of the above: sync compares shift by this
  PIXEL_PRELOAD_LEAD: 16   # hblank fetch lead: first byte 2 + skip-discard 2
                           # + 7 alignment shifts = 11, rounded up (was 35 in
                           # rev-1 VIDEO, which had 32 clocks of in-band header)

# Firmware<->application syscall ABI.  Apps are independent flat binaries linked
# at _app_base; they reach firmware services with TRAP #15: call number in d0,
# up to three args in d1/d2/d3 (pointers passed as longs), return value in d0.
# d0 >= 0 is the result; d0 < 0 is -errno (Linux convention).  d0-d3 are
# clobbered.  These numbers are the contract shared by the firmware dispatch
# (sys_dispatch) and the app-side stubs (apps/lib/syscalls.c), which mirror the
# newlib libgloss functions of the same name in firmware/syscalls.c.
syscalls:
  trap: 15
  calls:
    - name: EXIT
      number: 0
      description: "Terminate the application and return control to the firmware."
    - name: WRITE
      number: 1
      description: "write(fd in d1, buf in d2, len in d3) to the console or a file."
    - name: READ
      number: 2
      description: "read(fd in d1, buf in d2, len in d3) from the console or a file."
    - name: OPEN
      number: 3
      description: "open(path in d1, flags in d2, mode in d3) and return a file descriptor."
    - name: CLOSE
      number: 4
      description: "close(fd in d1) a previously opened file descriptor."
    - name: LSEEK
      number: 5
      description: "lseek(fd in d1, offset in d2, whence in d3) within an open file."
    - name: FSTAT
      number: 6
      description: "fstat(fd in d1, struct stat in d2) for an open file descriptor."
    - name: ISATTY
      number: 7
      description: "isatty(fd in d1) returns nonzero if the descriptor is a terminal."
    - name: STAT
      number: 8
      description: "stat(path in d1, struct stat in d2) for a named file."
    - name: INPUTREADY
      number: 9
      description: "Return 1 if console input is ready so a read from the console would not block."
    - name: READDIR
      number: 10
      description: "readdir(path in d1, index in d2, entry buffer in d3) fills one directory entry and returns 0, or 1 past the end."
    - name: GETTICKS
      number: 11
      description: "Return milliseconds since boot as an unsigned 32-bit count that wraps."
    - name: GETTIME
      number: 12
      description: "Return seconds since the Unix epoch derived from the boot epoch plus milliseconds since boot."

bodges:
  - "Reroute A6 pad on U12 to A18"
  - "Route freed GLUE pin 75 to CPU ~VPA"
  - "Pull up CPU HALT with 4.7K to nearby CPU +5V"

issues:
  - "ENGINE's peripheral registers: block above still describes the rev-1 streaming engine (SOURCE_PAGE/CTRL); the promoted display-list engine.v has DESC (15-bit descriptor word address, write arms) and a different CTRL. Update the register map + firmware + emulator together — the generated ENGINE_* header constants are stale until then."
  - "Rev-2 FIFO desync telemetry is TBD: the display-list ENGINE no longer drives the 7200s' 9th-bit toggle, so VIDEO's Q8 detector has no signal and PIXEL dropped it. Decide whether rev 2 wants any desync observability (a status the CPU can poll?) or whether frame-bounded /RS recovery is enough."
  - "pixel_skip open decisions from the PIXEL fit: (1) with nonzero skip the line's final partial byte is never fetched, so the last <=7 px tile the previous byte — pad the per-line PIXELS record by a byte (costs a real byte counter, ~8 FF vs 6 spare cells) or declare fine skip costs the tail; (2) odd skip in micro-HAM shifts code phase and mis-parses the line — enforce even in the author or force skip[0]=0 in HAM mode (~1 cell)."
  - "need to address *what* raises nIRQ on ENGINE; it's reserved and routed but always 1."
  - "need to finalize micro-HAM; not in the YAML, disagreement between encoder and implementation"
